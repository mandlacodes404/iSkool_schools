<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iSkool LMS – Learner Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #1a1919;
  --surface2: #161b22;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(190,188,188,0.08);
  --accent: #4fd1c5;
  --accent-dim: rgba(79,209,197,0.08);
  --secondary: #f6877a;
  --text: #e2e8f0;
  --muted: #8b949e;
  --danger: #f85149;
  --green: #22c55e;
  --purple: #a78bfa;
  --yellow: #f59e0b;
  --orange: #e67e22;
  --sidebar-w: 260px;
  --header-h: 60px;
  --radius: 16px;
  --t: 0.3s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  font-weight: 600;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  padding: 20px;
  position: fixed;
  top: 0; left: -100%;
  height: 100vh;
  z-index: 5000;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
  border-top-right-radius: 20px;
  border-bottom-right-radius: 20px;
  border-right: 1px solid var(--border2);
  transition: left var(--t);
  visibility: hidden; opacity: 0;
}
.sidebar::-webkit-scrollbar { display: none; }
.sidebar.open { left: 0; visibility: visible; opacity: 1; }

.sb-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 14px;
}
.avatar-wrap {
  width: 44px; height: 44px; border-radius: 50%;
  background: #121212; border: 2px solid #8b8989;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #8b8989;
  text-transform: uppercase; cursor: pointer; overflow: hidden; flex-shrink: 0;
}
.avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
.sb-close {
  width: 38px; height: 38px; border-radius: 50%;
  background: #000; border: 2px solid #333; color: var(--text);
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.sb-close:hover { background: #111; }
.learner-name { font-size: 18px; font-weight: 800; color: #fff; margin-top: 6px; }
.learner-email { font-size: 12px; color: var(--muted); margin-top: 2px; margin-bottom: 4px; }

.sb-links { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
.sb-link {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px;
  color: #b2b5b9; text-decoration: none; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; border: none; background: none;
  width: 100%; text-align: left; font-family: 'Nunito', sans-serif;
}
.sb-link:hover { background: var(--accent-dim); color: #fff; transform: translateX(2px); }
.sb-link.active { background: rgba(79,209,197,0.15); box-shadow: inset 4px 0 0 0 #8b949e; }
.sb-link svg { flex-shrink: 0; }
.sb-footer {
  margin-top: auto; padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 13px; color: #555; text-align: center; letter-spacing: 1px;
}

/* ─── OVERLAY ─── */
#overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 4999; opacity: 0; pointer-events: none;
  transition: opacity var(--t);
}
#overlay.show { opacity: 1; pointer-events: all; }

/* ─── MAIN ─── */
.main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  width: 100%;
}

/* ─── HEADER ─── */
.main-header {
  height: var(--header-h);
  background: rgba(26,25,25,0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  flex-shrink: 0;
  position: sticky; top: 0; z-index: 1000;
}
.header-left { flex: 1; display: flex; align-items: center; gap: 10px; }
.header-brand {
  flex: 2; display: flex; justify-content: center; align-items: center; gap: 10px;
}
.brand-logo {
  width: 38px; height: 38px; border-radius: 8px;
  border: 2px solid #757272;
  background: linear-gradient(135deg,#1a3a3a,#0d2424);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: var(--accent);
}
.brand-school { font-size: 16px; font-weight: 700; color: var(--text); }
.header-right { flex: 1; display: flex; justify-content: flex-end; }

.hdr-btn {
  background: none; border: none; color: var(--text);
  cursor: pointer; padding: 8px; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s;
}
.hdr-btn:hover { color: var(--secondary); }

.menu-btn {
  background: #000; border: 2px solid #333; color: var(--text);
  width: 38px; height: 38px; border-radius: 19%;
  cursor: pointer; display: none; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.menu-btn:hover { background: #111; }

/* ─── CONTENT ─── */
#content {
  flex: 1; overflow-y: auto; padding: 20px;
  padding-bottom: 90px;
}
#content::-webkit-scrollbar { width: 6px; }
#content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
#content::-webkit-scrollbar-thumb:hover { background: rgba(79,209,197,0.5); }

/* ─── MOBILE BOTTOM NAV ─── */
.mob-nav {
  display: none; position: fixed; bottom: 0; left: 0; width: 100%;
  height: 68px;
  background: rgba(27,27,27,0.9);
  backdrop-filter: blur(20px);
  border-top: 3px solid rgba(255,255,255,0.12);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  z-index: 4000; justify-content: space-around; align-items: flex-start;
  padding-top: 8px;
}
.mob-tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  color: var(--muted); font-size: 10px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  border: none; background: none; font-family: 'Nunito', sans-serif;
}
.mob-tab.active, .mob-tab:hover { color: var(--accent); transform: translateY(-3px); }

/* ─── DEMO BANNER ─── */
.demo-banner {
  background: linear-gradient(135deg, rgba(79,209,197,0.1), rgba(246,135,122,0.07));
  border: 1px solid rgba(79,209,197,0.25);
  border-radius: 10px; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px; font-size: 13px; color: var(--muted);
}
.demo-tag {
  background: var(--accent); color: #0d1117;
  padding: 2px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 900; letter-spacing: 1px; flex-shrink: 0;
}

/* ─── HOME / MANUAL ─── */
.manual-container { max-width: 800px; margin: 0 auto; }
.manual-greeting { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 4px; }
.manual-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.quick-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; text-align: center; cursor: pointer;
  transition: all 0.2s;
}
.stat-card:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.stat-num { font-size: 28px; font-weight: 900; }
.stat-lbl { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

.activity-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 8px;
}
.act-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.act-text { flex: 1; font-size: 13px; color: #c9d1d9; }
.act-time { font-size: 12px; color: var(--muted); }

.section-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; margin-bottom: 12px;
  cursor: pointer; transition: all 0.2s;
}
.section-card:hover { border-color: rgba(79,209,197,0.3); transform: translateX(4px); }
.sc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sc-icon {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sc-title { font-size: 15px; font-weight: 800; color: var(--text); }
.sc-body { font-size: 13px; color: var(--muted); line-height: 1.5; padding-left: 50px; }

/* ─── QUIZ CARDS ─── */
.quiz-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; transition: border-color 0.2s;
}
.quiz-card:hover { border-color: rgba(79,209,197,0.25); }
.quiz-card h4 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.quiz-info-text { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.subj-head { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 4px; }
.q-action-start { color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
.q-action-done { color: var(--green); font-weight: 700; font-size: 13px; }
.q-action-closed { color: var(--muted); font-weight: 700; font-size: 13px; }
.q-action-progress { color: var(--orange); font-weight: 700; font-size: 13px; cursor: pointer; }

/* ─── INSTRUCTIONS ─── */
.inst-container {
  max-width: 700px; margin: auto;
  background: #1b1b1b; padding: 30px;
  border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
}
.quiz-info-box {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
  padding: 18px; border-radius: 10px; margin-bottom: 25px; color: var(--muted);
}
.quiz-info-box p { margin: 6px 0; font-size: 14px; }
.quiz-info-box strong { color: var(--text); }
.inst-list { list-style: none; padding: 0; }
.inst-list li { margin-bottom: 12px; color: var(--muted); position: relative; padding-left: 24px; font-size: 14px; }
.inst-list li::before { content: "•"; color: var(--accent); position: absolute; left: 0; font-weight: bold; }
.ai-box { background: rgba(79,209,197,0.05); border: 1px solid rgba(79,209,197,0.3); border-radius: 10px; padding: 15px; margin-top: 25px; }
.start-btn {
  background: rgba(79,209,197,0.1); color: var(--text);
  padding: 14px 30px; border: 1px solid rgba(255,255,255,0.05);
  border-radius: 10px; font-weight: 700; cursor: pointer;
  width: 100%; max-width: 320px; display: block; margin: 35px auto 0;
  transition: 0.3s; font-family: 'Nunito', sans-serif; font-size: 15px;
}
.start-btn:hover { border-color: var(--accent); background: rgba(79,209,197,0.2); }

/* ─── ASSIGNMENTS ─── */
.assign-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; margin-bottom: 12px;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  transition: border-color 0.2s;
}
.assign-card:hover { border-color: rgba(79,209,197,0.25); }
.assign-info { flex: 1; }
.assign-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.assign-meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.assign-desc { font-size: 13px; color: #bbb; line-height: 1.5; margin-bottom: 10px; }
.assign-links { display: flex; gap: 12px; flex-wrap: wrap; }
.assign-link {
  color: var(--accent); font-size: 12px; font-weight: 700;
  display: flex; align-items: center; gap: 4px; cursor: pointer;
}
.assign-action { white-space: nowrap; font-weight: 700; font-size: 13px; padding-top: 4px; }

/* ─── GRADES ─── */
.grades-wrap { max-width: 780px; margin: 0 auto; }
.grades-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.grades-title { font-size: 20px; font-weight: 800; color: var(--text); }
.grades-report-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 16px; background: var(--accent-dim);
  color: var(--accent); border: 1px solid rgba(79,209,197,0.3);
  border-radius: 10px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s;
}
.grades-report-btn:hover { background: rgba(79,209,197,0.2); }
.subject-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 14px; overflow: hidden; transition: border-color 0.2s;
}
.subject-card:hover { border-color: rgba(255,255,255,0.1); }
.subject-header {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 20px; cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  transition: background 0.2s;
}
.subject-header:hover { background: rgba(255,255,255,0.02); }
.subject-name { flex: 1; font-size: 16px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
.subject-count {
  font-size: 12px; color: var(--muted); font-weight: 600;
  background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 20px;
}
.subject-chev { transition: transform 0.3s; color: #4a5568; }
.subject-chev.open { transform: rotate(90deg); }
.view-toggle-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px 6px; border-bottom: 1px solid rgba(255,255,255,0.04);
}
.vt-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: none; color: var(--muted);
  font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif;
  text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer;
  padding: 6px 10px; border-radius: 8px; transition: all 0.2s;
}
.vt-btn:hover { background: var(--accent-dim); color: var(--accent); }
.vt-btn.active-view { color: var(--accent); background: var(--accent-dim); }
.quiz-list { padding: 8px 16px 16px; }
.quiz-row {
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
  border-radius: 10px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s, transform 0.2s;
}
.quiz-row:hover { border-color: rgba(79,209,197,0.2); transform: translateX(3px); }
.quiz-row-header {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px; cursor: pointer;
}
.quiz-row-title {
  flex: 1; font-size: 14px; font-weight: 700; color: var(--accent);
  display: flex; align-items: center; gap: 6px;
}
.score-pill {
  font-size: 12px; font-weight: 800;
  padding: 3px 10px; border-radius: 20px; flex-shrink: 0;
}
.score-high { background: rgba(34,197,94,0.15); color: var(--green); }
.score-mid { background: rgba(79,209,197,0.15); color: var(--accent); }
.score-low { background: rgba(248,81,73,0.15); color: var(--danger); }
.score-pending { background: rgba(255,255,255,0.05); color: #4a5568; }
.quiz-row-details {
  display: none; padding: 12px 16px 14px;
  border-top: 1px solid rgba(255,255,255,0.04);
  background: rgba(0,0,0,0.2); font-size: 13px; color: var(--muted); line-height: 1.7;
}
.quiz-row-details p { margin: 2px 0; }
.quiz-row-details strong { color: #c9d1d9; }
.view-details-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-dim); color: var(--accent);
  border: 1px solid rgba(79,209,197,0.2); padding: 5px 12px;
  border-radius: 8px; font-size: 12px; font-weight: 700;
  font-family: 'Nunito', sans-serif; cursor: pointer; margin-top: 6px; transition: background 0.2s;
}
.view-details-btn:hover { background: rgba(79,209,197,0.15); }

/* Term table */
.term-table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
.term-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.term-table th { padding: 10px 14px; text-align: left; color: var(--accent); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); }
.term-table th:not(:first-child) { text-align: center; }
.term-table td { padding: 10px 14px; color: #c9d1d9; border-bottom: 1px solid rgba(255,255,255,0.04); }
.term-table td:not(:first-child) { text-align: center; }
.term-table tr:last-child td { border-bottom: none; }
.term-total td { font-weight: 800; color: var(--accent); border-top: 2px solid rgba(79,209,197,0.3) !important; }

/* ─── RESOURCES ─── */
.resource-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 14px; cursor: pointer;
  transition: border-color 0.2s, transform 0.2s;
}
.resource-card:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.res-icon { flex-shrink: 0; }
.res-info { flex: 1; }
.res-name { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 4px; }
.res-meta { font-size: 12px; color: var(--muted); }

/* ─── ANNOUNCEMENTS ─── */
.ann-card {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--yellow);
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
  transition: border-color 0.2s, transform 0.2s;
}
.ann-card:hover { border-color: rgba(245,158,11,0.4); transform: translateX(4px); }
.ann-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.ann-preview { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
.ann-date { font-size: 12px; color: #555e6a; }

/* ─── DISCUSSIONS ─── */
.disc-card {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 12px; padding: 16px 18px; margin-bottom: 12px;
  cursor: pointer; transition: border-color 0.2s, transform 0.2s;
}
.disc-card:hover { border-color: rgba(79,209,197,0.4); transform: translateX(4px); }
.disc-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.disc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.disc-replies {
  background: var(--accent-dim); color: var(--accent);
  border: 1px solid rgba(79,209,197,0.2);
  padding: 2px 10px; border-radius: 12px; font-weight: 700; font-size: 12px;
}

/* ─── EVALUATIONS ─── */
.eval-form {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 24px; margin-bottom: 16px;
}
.eval-q { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 16px; border-left: 4px solid var(--accent); padding-left: 12px; }
.eval-options { display: flex; flex-direction: column; gap: 8px; }
.eval-option {
  padding: 10px 14px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.07);
  font-size: 14px; color: #c9d1d9; cursor: pointer;
  transition: all 0.2s; display: flex; align-items: center; gap: 10px;
}
.eval-option:hover { border-color: rgba(79,209,197,0.3); background: var(--accent-dim); }
.eval-option.selected { border-color: var(--accent); background: rgba(79,209,197,0.12); color: var(--text); }
.eval-option-dot {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2); flex-shrink: 0;
  transition: all 0.2s;
}
.eval-option.selected .eval-option-dot { background: var(--accent); border-color: var(--accent); }
.eval-submit {
  background: var(--accent); color: #0d1117;
  border: none; padding: 12px 24px; border-radius: 10px;
  font-size: 14px; font-weight: 800; cursor: pointer;
  font-family: 'Nunito', sans-serif; margin-top: 20px;
  display: block; width: 100%; transition: background 0.2s;
}
.eval-submit:hover { background: #3ab8ae; }

/* ─── SYLLABUS ─── */
.syl-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 14px; overflow: hidden;
}
.syl-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; cursor: pointer; border-bottom: 1px solid var(--border);
  transition: background 0.2s;
}
.syl-head:hover { background: rgba(255,255,255,0.02); }
.syl-class-name { font-size: 15px; font-weight: 700; color: var(--accent); }
.syl-body { padding: 16px 18px; }
.syl-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.syl-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid #30363d;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.syl-check.done { background: var(--accent); border-color: var(--accent); color: #0d1117; }
.syl-topic { font-size: 14px; color: #c9d1d9; }
.syl-topic.done { text-decoration: line-through; opacity: 0.5; }
.syl-prog-bar { flex: 1; height: 5px; background: #21262d; border-radius: 3px; overflow: hidden; }
.syl-prog-fill { height: 100%; background: var(--accent); border-radius: 3px; }

/* ─── SETTINGS ─── */
.settings-wrap { max-width: 460px; margin: 0 auto; }
.settings-avatar-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
.settings-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: #1b1b1b; border: 3px solid #30363d;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 900; color: var(--muted);
  cursor: pointer; transition: border-color 0.2s;
}
.settings-avatar:hover { border-color: var(--accent); }
.settings-hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
.settings-card {
  background: #1b1b1b; border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 14px; cursor: pointer;
  transition: background 0.2s;
}
.settings-card:hover { background: #21262d; }
.settings-card-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.settings-card-info { flex: 1; }
.settings-card-name { font-size: 14px; font-weight: 700; color: var(--text); }
.settings-card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ─── TOAST ─── */
.toast {
  position: fixed; bottom: 80px; right: 20px;
  background: var(--surface); border: 1px solid var(--accent);
  border-radius: 10px; padding: 12px 18px;
  font-size: 14px; font-weight: 700; color: var(--text);
  z-index: 9999; display: none; animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  z-index: 9000; display: none;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface); border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08); width: 90%; max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  font-size: 16px; font-weight: 700; color: var(--accent);
}
.modal-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
.modal-body { padding: 20px; font-size: 14px; color: #c9d1d9; line-height: 1.7; }
.modal-foot {
  display: flex; justify-content: flex-end; padding: 16px 20px;
  border-top: 1px solid var(--border);
}
.modal-ok {
  background: var(--accent); border: none; color: #0d1117;
  padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 800;
  cursor: pointer; font-family: 'Nunito', sans-serif;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .mob-nav { display: flex !important; }
  #content { padding-bottom: 88px; }
  .quick-stats { grid-template-columns: repeat(3,1fr); }
  #desktopBtn { display: none !important; }
  #mobileBtn { display: flex !important; }
  .brand-school { display: none; }
}
@media (min-width: 769px) {

  #desktopBtn { display: flex !important; }
}

// ── QUIZZES ──
function renderQuizzes() {
  let html = `${demoBanner()}`;
  for (const [subj, quizzes] of Object.entries(D.quizzes)) {
    html += `<div class="subj-head">${subj}</div>`;
    quizzes.forEach(q => {
      let action = '';
      if (q.attempt === 'submitted') {
        action = `<span class="q-action-done">✓ Completed</span>`;
      } else if (q.status === 'Closed') {
        action = `<span class="q-action-closed">Closed</span>`;
      } else if (q.scheduled) {
        action = `<span style="color:#fdd663;font-weight:700;font-size:13px;">Starts in 14d</span>`;
      } else if (q.attempt === 'in_progress') {
        action = `<span class="q-action-progress" onclick="loadInstructions(${q.id})">Continue</span>`;
      } else {
        action = `<span class="q-action-start" onclick="loadInstructions(${q.id})">Start</span>`;
      }
      html += `
        <div class="quiz-card">
          <div>
            <h4>${q.title}</h4>
            <div class="quiz-info-text">
              <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${q.duration} mins &nbsp;|&nbsp;
              <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              ${q.date}
            </div>
          </div>
          ${action}
        </div>`;
    });
  }
  document.getElementById('content').innerHTML = html;
}

function loadInstructions(id) {
  const q = Object.values(D.quizzes).flat().find(x => x.id === id);
  if (!q) return;
  const isContinue = q.attempt === 'in_progress';
  document.getElementById('content').innerHTML = `
    <div class="inst-container">
      <h2 style="text-align:center;color:var(--text);margin-bottom:25px;">Quiz Instructions</h2>
      <div class="quiz-info-box">
        <p><strong>Quiz Title:</strong> ${q.title}</p>
        <p><strong>Duration:</strong> ${q.duration} minutes</p>
        <p><strong>Attempts Allowed:</strong> 1</p>
      </div>
      <h3 style="color:#c9d1d9;margin-bottom:12px;">⚠️ Please read carefully:</h3>
      <ul class="inst-list">
        ${isContinue ? `<li style="color:#e67e22"><strong>Note:</strong> You have an unfinished attempt. You will resume.</li>` : ''}
        <li>You can only attempt this quiz <strong>1</strong> time.</li>
        <li>The timer starts immediately and cannot be paused.</li>

        <h4 style="color:var(--accent);margin-top:0;">🤖 AI Invigilator Active</h4>
        <p style="font-size:13px;color:var(--muted);margin:0;">Tab switching and quiz exits are monitored and logged per question.</p>

  `;
}

function buildGradesList(quizzes, gi) {
  return quizzes.map((q, qi) => {
    const pub = q.published;
    const pct = pub ? Math.round((q.score/q.total)*100) : 0;
    const pillCls = !pub ? 'score-pending' : pct>=75 ? 'score-high' : pct>=50 ? 'score-mid' : 'score-low';
    const pillTxt = pub ? `${pct}%` : 'Pending';
    const icon = pub
      ? `<svg viewBox="0 0 24 24" width="16" height="16" stroke="#4fd1c5" stroke-width="2" fill="none"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`
      : `<svg viewBox="0 0 24 24" width="16" height="16" stroke="#f85149" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
    return `
      <div class="quiz-row">
        <div class="quiz-row-header" onclick="toggleRow('gdetail-${gi}-${qi}','gexp-${gi}-${qi}')">
          ${icon}
          <div class="quiz-row-title">${q.title}${q.summative?'<span style="font-size:10px;border:1px solid rgba(79,209,197,0.3);color:#4fd1c5;padding:1px 6px;border-radius:10px;font-weight:700;">Term</span>':''}</div>
          <span class="score-pill ${pillCls}">${pillTxt}</span>
          <button id="gexp-${gi}-${qi}" style="background:none;border:none;color:#4a5568;cursor:pointer;padding:4px;display:flex;align-items:center;" onclick="event.stopPropagation();toggleRow('gdetail-${gi}-${qi}','gexp-${gi}-${qi}')">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
        <div class="quiz-row-details" id="gdetail-${gi}-${qi}">
          ${pub ? `<p><strong>Score:</strong> ${q.score} / ${q.total} &nbsp;·&nbsp; <strong>${pct}%</strong></p>
          <button class="view-details-btn" onclick="showToast('Class stats: Avg 67% | Highest 85% | Lowest 42%')">Class Performance</button>` 
          : `<p style="color:#4a5568;font-style:italic;">Marks not published yet.</p>`}
          <p style="margin-top:8px"><strong>Duration:</strong> ${q.duration} min</p>
          <p><strong>Taken on:</strong> ${q.taken}</p>
        </div>
      </div>`;
  }).join('');
}

function buildTermTable(quizzes) {
  const summative = quizzes.filter(q => q.summative && q.published);
  if (!summative.length) return `<p style="text-align:center;color:#4a5568;font-style:italic;padding:20px;">No summative assessments in Term 1 yet.</p>`;
  let rows = '';
  let earnedTotal = 0, weightTotal = 0;
  summative.forEach(q => {
    const earned = q.total > 0 ? (q.score/q.total)*q.weight : 0;
    earnedTotal += earned; weightTotal += q.weight;
    rows += `<tr><td>${q.title}</td><td>${q.weight}%</td><td>${q.score}/${q.total}</td><td style="color:#4fd1c5;font-weight:800">${earned.toFixed(1)}/${q.weight}%</td></tr>`;
  });
  const finalPct = weightTotal > 0 ? Math.round((earnedTotal/weightTotal)*100) : 0;
  return `
    <div class="term-table-wrap">
      <table class="term-table">
        <thead><tr><th>Quiz</th><th>Weight</th><th>Score</th><th>Earned</th></tr></thead>
        <tbody>
          ${rows}
          <tr class="term-total"><td>TOTAL</td><td>${weightTotal}%</td><td>—</td><td style="color:#22c55e">${earnedTotal.toFixed(1)}/${weightTotal}% → ${finalPct}%</td></tr>
        </tbody>
      </table>
    </div>
    <p style="text-align:center;font-size:12px;color:#4a5568;margin-top:8px;">70% of term still to be assessed</p>`;
}

function toggleCard(i) {
  const body = document.getElementById('gcard-'+i);
  const chev = document.getElementById('gchev-'+i);
  const isOpen = chev.classList.contains('open');
  body.style.display = isOpen ? 'none' : 'block';
  chev.classList.toggle('open', !isOpen);
}
function toggleRow(detailId, btnId) {
  const d = document.getElementById(detailId);
  if (!d) return;
  const open = d.style.display === 'block';
  d.style.display = open ? 'none' : 'block';
  const btn = document.getElementById(btnId);
  if (btn) btn.querySelector('svg').style.transform = open ? '' : 'rotate(180deg)';
}
function switchView(gi, view) {
  const listEl = document.getElementById('glist-'+gi);
  const termEl = document.getElementById('gterm-'+gi);
  const btnL = document.getElementById('vt-list-'+gi);
  const btnT = document.getElementById('vt-term-'+gi);
  if (view === 'list') {
    listEl.style.display = 'block'; termEl.style.display = 'none';
    btnL.classList.add('active-view'); btnT.classList.remove('active-view');
  } else {
    listEl.style.display = 'none'; termEl.style.display = 'block';
    btnL.classList.remove('active-view'); btnT.classList.add('active-view');
  }
}

          <div style="flex:1;padding:10px;text-align:center;background:#161b22;border:1px solid ${t===1?'rgba(79,209,197,0.35)':'rgba(255,255,255,0.07)'};border-radius:10px;${t>1?'opacity:0.35;':''}">
            <div style="font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:${t===1?'#4fd1c5':'#8b949e'};">Term ${t}</div>
            <div style="font-size:18px;font-weight:900;color:${t===1?'#4fd1c5':'#8b949e'};margin:4px 0;">${t===1?'69%':'—'}</div>
            <div style="font-size:10px;color:#4a5568;">${t===1?'Current':'Upcoming'}</div>
          </div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;">
        <div style="background:#161b22;border:1px solid rgba(255,255,255,0.07);border-radius:12px;padding:18px;position:relative;overflow:hidden;border-left:3px solid #4fd1c5;">
          <div style="font-size:13px;font-weight:800;color:var(--text);margin-bottom:16px;">Grade 10A – Mathematics</div>
          <div style="font-size:24px;font-weight:900;color:#4fd1c5;position:absolute;top:16px;right:16px;">69%</div>
          <div style="height:6px;background:rgba(255,255,255,0.06);border-radius:100px;margin-bottom:8px;overflow:hidden;"><div style="width:69%;height:100%;background:#4fd1c5;border-radius:100px;"></div></div>
          <div style="font-size:11px;color:#4a5568;">1 of 5 assessments counted · 70% still to come</div>
        </div>
      </div>
    </div>`;
}

// ── EVALUATIONS ──
function renderEvaluations() {
  const submitted = Object.keys(evalSelections).length === D.evalQuestions.length &&
    Object.values(evalSelections).every(v => v !== undefined);
  let html = `${demoBanner()}
    <div style="max-width:600px;margin:0 auto;">
      <div style="background:rgba(79,209,197,0.06);border:1px solid rgba(79,209,197,0.2);border-radius:12px;padding:14px 16px;margin-bottom:20px;font-size:13px;color:var(--muted);line-height:1.6;">
        <strong style="color:var(--accent)">Help improve your learning experience.</strong> Your responses are anonymous and help your teacher understand how to support you better.
      </div>`;
  D.evalQuestions.forEach((q, i) => {
    html += `
      <div class="eval-form">
        <div class="eval-q">${q}</div>
        <div class="eval-options">
          ${D.evalOptions.map((opt,oi) => `
            <div class="eval-option ${evalSelections[i]===oi?'selected':''}" onclick="selectEval(${i},${oi})">
              <div class="eval-option-dot"></div>
              ${opt}
            </div>`).join('')}
        </div>
      </div>`;
  });
  html += `<button class="eval-submit" onclick="submitEvaluations()">Submit Evaluation</button></div>`;
  document.getElementById('content').innerHTML = html;
}

function selectEval(q, o) {
  evalSelections[q] = o;
  renderEvaluations();
}
function submitEvaluations() {
  const all = D.evalQuestions.every((_, i) => evalSelections[i] !== undefined);
  if (!all) { showToast('Please answer all questions before submitting.'); return; }
  evalSelections = {};
  openModal('Evaluation Submitted ✓', '<p style="color:#c9d1d9;line-height:1.7;font-size:14px;">Thank you for your feedback! Your responses have been recorded anonymously.</p>');
}

// ── SYLLABUS ──
function renderSyllabus() {
  let html = `${demoBanner()}`;
  D.syllabus.forEach((s, si) => {
    const done = s.topics.filter(t => t.done).length;
    const pct = Math.round(done/s.topics.length*100);
    html += `
      <div class="syl-card">
        <div class="syl-head" onclick="toggleSyl(${si})">
          <div>
            <div class="syl-class-name">${s.class}</div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px;">${done}/${s.topics.length} topics complete</div>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:70px;height:5px;background:#21262d;border-radius:3px;overflow:hidden;"><div style="width:${pct}%;height:100%;background:var(--accent);border-radius:3px;"></div></div>
            <span style="font-size:13px;font-weight:800;color:var(--accent);">${pct}%</span>
          </div>
        </div>
        <div class="syl-body" id="syl-${si}">
          ${s.topics.map((t,ti) => `
            <div class="syl-row">
              <div class="syl-check${t.done?' done':''}">
                ${t.done?'<svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg>':''}
              </div>
              <div class="syl-topic${t.done?' done':''}">${t.name}</div>
              ${t.done?'<span style="font-size:11px;background:rgba(34,197,94,0.12);color:#22c55e;padding:2px 8px;border-radius:10px;font-weight:700;">Done</span>':'<span style="font-size:11px;color:#4a5568;">Upcoming</span>'}
            </div>`).join('')}
        </div>
      </div>`;
  });
  document.getElementById('content').innerHTML = html;
}
function toggleSyl(i) {
  const el = document.getElementById('syl-'+i);
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
