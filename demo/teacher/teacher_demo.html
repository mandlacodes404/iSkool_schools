<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iSkool LMS – Teacher Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #1a1919;
  --border: rgba(255,255,255,0.06);
  --border2: #30363d;
  --accent: #4fd1c5;
  --accent-dim: rgba(79,209,197,0.15);
  --text: #e2e8f0;
  --muted: #8b949e;
  --danger: #f85149;
  --orange: #f97316;
  --purple: #a78bfa;
  --green: #22c55e;
  --yellow: #f59e0b;
  --sidebar-w: 260px;
  --radius: 14px;
  --transition: 0.3s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  font-weight: 600;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface2);
  display: flex;
  flex-direction: column;
  padding: 20px;
  position: fixed;
  top: 0; left: -100%;
  height: 100vh;
  z-index: 5000;
  overflow-y: auto;
  box-shadow: 2px 0 12px rgba(0,0,0,0.3);
  transition: left var(--transition);
  visibility: hidden;
  opacity: 0;
}
.sidebar.open {
  left: 0;
  visibility: visible;
  opacity: 1;
}
.sidebar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.avatar-circle {
  width: 46px; height: 46px;
  border-radius: 50%;
  background: #2d2d2d;
  border: 3px solid #555;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: -1px;
  cursor: pointer; overflow: hidden; flex-shrink: 0;
}
.avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
.round-toggle {
  width: 38px; height: 38px; border-radius: 50%;
  background: #111; border: 2px solid #333; color: var(--text);
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.round-toggle:hover { background: #222; }
.teacher-name { font-size: 17px; color: #fff; font-weight: 800; margin-top: 8px; }
.teacher-email { font-size: 12px; color: var(--muted); margin-top: 3px; }
.sidebar-links { margin-top: 20px; display: flex; flex-direction: column; gap: 2px; }
.sidebar-link {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px;
  color: var(--text); text-decoration: none;
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  border: none; background: none; width: 100%; text-align: left;
  font-family: 'Nunito', sans-serif;
}
.sidebar-link:hover { background: var(--accent-dim); transform: translateX(3px); }
.sidebar-link.active { background: rgba(79,209,197,0.2); border-left: 4px solid var(--accent); }
.sidebar-link svg { flex-shrink: 0; }
.sidebar-footer {
  margin-top: auto; padding-top: 20px;
  border-top: 1px solid var(--border);
  text-align: center; font-size: 13px; color: #555; letter-spacing: 1px;
}

/* ─── OVERLAY ─── */
#overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(6px);
  z-index: 4999;
  opacity: 0; pointer-events: none;
  transition: opacity var(--transition);
}
#overlay.show { opacity: 1; pointer-events: all; }

/* ─── MAIN ─── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  margin-left: 0;
  width: 100%;
}

/* ─── TOP NAV ─── */
.top-nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border2);
  flex-shrink: 0;
}
.top-nav-row1 {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 12px 20px; gap: 12px;
}
.nav-left { display: flex; align-items: center; gap: 12px; }
.hamburger {
  background: #21262d; border: 1px solid var(--border2);
  color: var(--text); width: 36px; height: 36px;
  border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.hamburger:hover { background: #30363d; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: center; }
.brand-logo {
  width: 36px; height: 36px; border-radius: 8px;
  border: 2px solid var(--border2);
  background: linear-gradient(135deg,#1a3a3a,#0d2424);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: var(--accent);
}
.brand-name { font-size: 15px; font-weight: 800; color: var(--text); }
.nav-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

/* Search */
.search-wrap { position: relative; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: #21262d; border: 1px solid var(--border2);
  border-radius: 6px; padding: 6px 12px; width: 220px;
  transition: border-color 0.2s;
}
.search-box:focus-within { border-color: var(--accent); }
.search-box input {
  background: none; border: none; outline: none;
  color: var(--text); font-size: 13px; font-weight: 600;
  font-family: 'Nunito', sans-serif; width: 100%;
}
.search-box input::placeholder { color: var(--muted); }
.search-kbd {
  font-size: 11px; color: #555; border: 1px solid var(--border2);
  border-radius: 4px; padding: 1px 5px;
}

/* Avatar button */
.avatar-btn { position: relative; }
.top-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid var(--border2); cursor: pointer;
  background: #21262d;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: var(--muted);
  transition: border-color 0.2s; text-transform: uppercase;
  overflow: hidden;
}
.top-avatar:hover { border-color: var(--accent); }
.avatar-drop {
  display: none; position: absolute; top: calc(100% + 8px); right: 0;
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 10px; min-width: 200px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 6000; overflow: hidden;
}
.avatar-drop.open { display: block; }
.drop-header { padding: 12px 16px; border-bottom: 1px solid #21262d; }
.drop-name { font-size: 14px; font-weight: 800; }
.drop-email { font-size: 12px; color: var(--muted); margin-top: 2px; }
.drop-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; font-size: 13px; font-weight: 600;
  color: #c9d1d9; cursor: pointer; transition: background 0.15s;
  border: none; background: none; width: 100%; text-align: left;
  font-family: 'Nunito', sans-serif;
}
.drop-item:hover { background: #21262d; color: var(--text); }
.drop-item.danger { color: var(--danger); }
.drop-item.danger:hover { background: rgba(248,81,73,0.08); }

/* ─── TAB BAR ─── */
.tab-bar {
  display: flex; align-items: center;
  padding: 0 20px; gap: 0;
  overflow-x: auto; scrollbar-width: none;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab {
  display: flex; align-items: center; gap: 7px;
  padding: 10px 14px; font-size: 13px; font-weight: 700;
  color: var(--muted); cursor: pointer;
  border: none; background: none;
  font-family: 'Nunito', sans-serif;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px; white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}
.tab:hover { color: var(--text); border-bottom-color: var(--border2); }
.tab.active { color: var(--text); border-bottom-color: var(--orange); }

/* ─── CONTENT ─── */
#content {
  flex: 1; overflow-y: auto; padding: 24px;
  padding-bottom: 100px;
}
#content::-webkit-scrollbar { width: 6px; }
#content::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.2); border-radius: 10px;
}
#content::-webkit-scrollbar-thumb:hover { background: rgba(79,209,197,0.5); }

/* ─── MOBILE BOTTOM NAV ─── */
.mobile-nav {
  display: none; position: fixed; bottom: 0; left: 0; width: 100%;
  height: 68px; background: rgba(26,25,25,0.9);
  backdrop-filter: blur(20px); border-top: 1px solid var(--border);
  z-index: 4000; justify-content: space-around; align-items: flex-start;
  padding-top: 6px;
}
.mob-tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  color: var(--muted); font-size: 10px; font-weight: 700;
  cursor: pointer; transition: all 0.2s; padding-top: 4px;
  border: none; background: none; font-family: 'Nunito', sans-serif;
}
.mob-tab.active, .mob-tab:hover { color: var(--accent); transform: translateY(-3px); }

/* ─── CARDS ─── */
.card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px;
  transition: border-color 0.2s, transform 0.2s;
}
.card:hover { border-color: rgba(79,209,197,0.25); }

/* ─── HOME / SNAPSHOT ─── */
.home-layout { display: flex; gap: 20px; height: 100%; align-items: flex-start; }
.snapshot-panel { width: 30%; flex-shrink: 0; }
.manual-panel { flex: 1; min-width: 0; }
.section-label {
  font-size: 11px; font-weight: 800; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px;
}
.snap-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  cursor: pointer; transition: transform 0.2s, border-color 0.2s;
}
.snap-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.12); }
.snap-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px;
}
.snap-title {
  font-size: 14px; font-weight: 700; color: var(--text);
  margin-bottom: 8px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.snap-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.badge {
  padding: 2px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 700;
}

/* Manual panel */
.manual-greeting { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 4px; }
.manual-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.quick-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; text-align: center;
  cursor: pointer; transition: all 0.2s;
}
.stat-card:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.stat-num { font-size: 28px; font-weight: 900; }
.stat-lbl { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.recent-section { margin-bottom: 20px; }
.recent-title { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.activity-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
}
.activity-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.activity-text { flex: 1; font-size: 13px; color: #c9d1d9; }
.activity-time { font-size: 12px; color: var(--muted); }

/* Calendar mini */
.cal-wrap { margin-top: 20px; }
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.cal-title { font-size: 13px; font-weight: 800; flex: 1; text-align: center; }
.cal-btn {
  background: none; border: none; color: var(--muted);
  font-size: 18px; cursor: pointer; transition: color 0.2s; line-height: 1;
}
.cal-btn:hover { color: var(--accent); }
.cal-grid {
  display: grid; grid-template-columns: repeat(7,1fr); gap: 2px;
}
.cal-lbl {
  text-align: center; font-size: 10px; font-weight: 800;
  color: var(--muted); padding: 4px 0; text-transform: uppercase;
}
.cal-cell {
  text-align: center; padding: 5px 2px; border-radius: 8px;
  cursor: pointer; font-size: 12px; color: #c9d1d9; font-weight: 600;
  transition: background 0.2s; position: relative;
  display: flex; flex-direction: column; align-items: center; min-height: 32px;
}
.cal-cell:hover { background: rgba(255,255,255,0.05); }
.cal-cell.today .day-num {
  background: var(--accent); color: #0d1117; border-radius: 50%;
  width: 22px; height: 22px; display: flex; align-items: center;
  justify-content: center; font-weight: 800;
}
.cal-dot-row { display: flex; gap: 2px; margin-top: 2px; }
.dot { width: 5px; height: 5px; border-radius: 50%; }
.dot-q { background: var(--accent); }
.dot-a { background: var(--purple); }
.dot-r { background: var(--yellow); }

/* ─── QUIZ PAGE ─── */
.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.page-title { font-size: 20px; font-weight: 900; color: var(--accent); }
.add-btn {
  display: flex; align-items: center; gap: 8px;
  background: var(--accent); color: #0d1117;
  border: none; padding: 10px 16px; border-radius: 10px;
  font-size: 14px; font-weight: 800; cursor: pointer;
  transition: background 0.2s; font-family: 'Nunito', sans-serif;
}
.add-btn:hover { background: #3ab8ae; }
.year-badge {
  display: inline-block; background: rgba(34,197,94,0.15);
  color: var(--green); border: 1px solid rgba(34,197,94,0.3);
  padding: 6px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 700; margin-bottom: 20px;
}
.term-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 16px; margin-bottom: 20px; overflow: hidden; padding: 20px;
}
.term-card.active-term { border-color: var(--green); box-shadow: 0 0 20px rgba(34,197,94,0.15); }
.term-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.term-name { font-size: 18px; font-weight: 900; color: var(--accent); }
.term-badge {
  background: var(--green); color: white;
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 800; letter-spacing: 1px;
}
.quiz-card {
  background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04);
  border-radius: 12px; margin-bottom: 10px; overflow: hidden;
  transition: border-color 0.2s;
}
.quiz-card:hover { border-color: rgba(79,209,197,0.2); }
.quiz-main {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; cursor: pointer;
}
.quiz-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.quiz-info { flex: 1; min-width: 0; }
.quiz-name { font-size: 14px; font-weight: 700; color: var(--text); }
.quiz-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
.status-badge {
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.status-open { background: rgba(242,140,56,0.15); color: #f28c38; }
.status-closed { background: rgba(107,114,128,0.15); color: #6b7280; }
.status-draft { background: rgba(79,209,197,0.15); color: var(--accent); }
.quiz-chevron { transition: transform 0.3s; }
.quiz-chevron.rotated { transform: rotate(180deg); }
.quiz-details {
  padding: 14px 16px 18px; border-top: 1px solid rgba(255,255,255,0.04);
  background: rgba(0,0,0,0.15); display: none;
}
.quiz-details.open { display: block; }
.quiz-detail-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; color: var(--muted); }
.quiz-detail-row strong { color: var(--text); }
.quiz-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.q-btn {
  padding: 7px 14px; border-radius: 8px;
  font-size: 12px; font-weight: 700; cursor: pointer; border: none;
  display: inline-flex; align-items: center; gap: 5px;
  font-family: 'Nunito', sans-serif; transition: opacity 0.2s;
}
.q-btn:hover { opacity: 0.85; }
.q-btn.results { background: rgba(79,209,197,0.1); color: var(--accent); border: 1px solid rgba(79,209,197,0.3); }
.q-btn.close-q { background: #6b7280; color: white; }
.q-btn.reopen { background: var(--green); color: white; }
.q-btn.integrity { background: rgba(243,156,18,0.1); color: #f39c12; border: 1px solid rgba(243,156,18,0.3); }

/* ─── ANNOUNCEMENTS ─── */
.ann-flat-card {
  display: flex; align-items: flex-start; gap: 14px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
  transition: border-color 0.2s, transform 0.2s;
}
.ann-flat-card:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.ann-icon { flex-shrink: 0; margin-top: 2px; }
.ann-info { flex: 1; }
.ann-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.ann-preview { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
.ann-date { font-size: 12px; color: #555e6a; }

/* ─── GRADES TABLE ─── */
.grades-table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
.grades-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.grades-table th {
  background: rgba(255,255,255,0.04); color: var(--accent);
  font-weight: 700; padding: 12px 16px; text-align: left;
  border-bottom: 1px solid var(--border);
}
.grades-table td { padding: 12px 16px; color: #c9d1d9; border-bottom: 1px solid rgba(255,255,255,0.04); }
.grades-table tr:last-child td { border-bottom: none; }
.grades-table tr:hover td { background: rgba(255,255,255,0.02); }
.grade-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
.grade-high { background: rgba(30,215,96,0.15); color: #1ed760; }
.grade-mid { background: rgba(79,209,197,0.15); color: var(--accent); }
.grade-low { background: rgba(231,76,60,0.15); color: #e74c3c; }
.class-group { margin-bottom: 24px; }
.class-label {
  font-size: 11px; font-weight: 800; color: var(--accent);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
}

/* ─── ANALYTICS ─── */
.kpi-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; margin-bottom: 24px; }
.kpi-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; text-align: center;
}
.kpi-val { font-size: 28px; font-weight: 900; }
.kpi-lbl { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px;
}
.chart-title { font-size: 14px; font-weight: 800; color: var(--text); margin-bottom: 16px; }
.chart-box { position: relative; height: 200px; }
.top-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.top-list-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px;
}
.top-list-title { font-size: 13px; font-weight: 800; text-align: center; margin-bottom: 14px; }
.performer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 10px; background: rgba(255,255,255,0.03);
  border-radius: 8px; margin-bottom: 6px; font-size: 13px;
}
.perf-name { color: #c9d1d9; font-weight: 600; }
.gender-gap { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 20px; }
.gender-row { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.gender-label { width: 100px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.gender-bar-bg { flex: 1; height: 28px; background: #21262d; border-radius: 14px; overflow: hidden; }
.gender-bar-fill { height: 100%; border-radius: 14px; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; font-size: 12px; font-weight: 800; color: #0d1117; transition: width 0.8s ease; }
.gender-pct { width: 40px; text-align: right; font-size: 13px; font-weight: 800; }

/* ─── RESOURCES ─── */
.resource-card {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  cursor: pointer; transition: border-color 0.2s, transform 0.2s;
}
.resource-card:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.res-icon { flex-shrink: 0; }
.res-info { flex: 1; }
.res-name { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 4px; }
.res-meta { font-size: 12px; color: var(--muted); }
.res-del { background: none; border: none; color: var(--danger); cursor: pointer; padding: 6px; border-radius: 8px; opacity: 0.6; transition: opacity 0.2s; }
.res-del:hover { opacity: 1; }

/* ─── DISCUSSIONS ─── */
.disc-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-left: 4px solid var(--accent);
  border-radius: 12px; padding: 18px 20px; margin-bottom: 12px;
  cursor: pointer; transition: border-color 0.2s, transform 0.2s;
}
.disc-card:hover { border-color: rgba(79,209,197,0.4); transform: translateY(-2px); }
.disc-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
.disc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.disc-reply-badge {
  background: rgba(79,209,197,0.1); color: var(--accent);
  border: 1px solid rgba(79,209,197,0.2);
  padding: 2px 10px; border-radius: 12px; font-weight: 700; font-size: 12px;
}

/* ─── SYLLABUS ─── */
.syl-class-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 14px; overflow: hidden;
}
.syl-class-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; cursor: pointer;
  transition: background 0.2s; border-bottom: 1px solid var(--border);
}
.syl-class-head:hover { background: rgba(255,255,255,0.03); }
.syl-class-name { font-size: 15px; font-weight: 700; color: var(--accent); }
.syl-progress-wrap { padding: 16px 18px; }
.syl-topic-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.syl-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border2); display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; cursor: pointer; transition: all 0.2s;
}
.syl-check.done { background: var(--accent); border-color: var(--accent); color: #0d1117; }
.syl-topic-name { font-size: 14px; color: #c9d1d9; flex: 1; }
.syl-prog-bar { flex: 1; height: 6px; background: #21262d; border-radius: 3px; overflow: hidden; }
.syl-prog-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s ease; }

/* ─── ASSIGNMENTS ─── */
.assign-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 14px; overflow: hidden;
  transition: border-color 0.2s;
}
.assign-card:hover { border-color: rgba(79,209,197,0.2); }
.assign-main {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; cursor: pointer;
}
.assign-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(167,139,250,0.15); flex-shrink: 0;
}
.assign-info { flex: 1; }
.assign-name { font-size: 15px; font-weight: 700; color: var(--text); }
.assign-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.assign-prog { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.assign-bar-bg { width: 120px; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.assign-bar-fill { height: 100%; border-radius: 3px; background: var(--purple); }
.assign-prog-label { font-size: 12px; font-weight: 700; color: var(--purple); }
.assign-details { padding: 14px 16px 18px; border-top: 1px solid rgba(255,255,255,0.04); background: rgba(0,0,0,0.15); display: none; }
.assign-details.open { display: block; }
.submission-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; background: rgba(255,255,255,0.02);
  border-radius: 8px; margin-bottom: 6px; font-size: 13px;
}
.sub-badge { padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
.sub-yes { background: rgba(34,197,94,0.15); color: var(--green); }
.sub-no { background: rgba(248,81,73,0.15); color: var(--danger); }

/* ─── SETTINGS ─── */
.settings-avatar-wrap {
  display: flex; flex-direction: column; align-items: center; margin-bottom: 28px;
}
.settings-avatar {
  width: 96px; height: 96px; border-radius: 50%;
  background: #1b1b1b; border: 3px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 900; color: var(--muted);
  cursor: pointer; transition: border-color 0.2s; position: relative; overflow: hidden;
}
.settings-avatar:hover { border-color: var(--accent); }
.settings-hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
.settings-card {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
  cursor: pointer; transition: border-color 0.2s;
  max-width: 460px; margin-left: auto; margin-right: auto;
}
.settings-card:hover { border-color: rgba(79,209,197,0.3); }
.settings-card-icon { flex-shrink: 0; }
.settings-card-info { flex: 1; }
.settings-card-name { font-size: 15px; font-weight: 700; color: var(--text); }
.settings-card-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* ─── CALENDAR (FULL) ─── */
.cal-full-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; }
.cal-full-cell {
  min-height: 70px; border-radius: 10px; padding: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  cursor: pointer; transition: border-color 0.2s;
}
.cal-full-cell:hover { border-color: rgba(79,209,197,0.3); }
.cal-full-cell.today { border-color: var(--accent); }
.cal-full-cell.empty { background: rgba(255,255,255,0.01); cursor: default; }
.cal-day-num2 { font-size: 13px; font-weight: 800; color: #c9d1d9; }
.cal-full-cell.today .cal-day-num2 { color: var(--accent); }
.cal-event-pill {
  margin-top: 4px; padding: 2px 6px; border-radius: 4px;
  font-size: 10px; font-weight: 700; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

/* ─── TOAST ─── */
.toast {
  position: fixed; bottom: 80px; right: 20px;
  background: #1a1919; border: 1px solid var(--accent);
  border-radius: 10px; padding: 12px 18px;
  font-size: 14px; font-weight: 700; color: var(--text);
  z-index: 9999; display: none;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  z-index: 9000; display: none;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--surface2); border-radius: 16px;
  border: 1px solid rgba(255,255,255,0.08); width: 90%; max-width: 460px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5); overflow: hidden;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border);
  font-size: 16px; font-weight: 700; color: var(--accent);
}
.modal-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
.modal-body { padding: 20px; }
.modal-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
.modal-label:first-child { margin-top: 0; }
.modal-input {
  width: 100%; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
  color: var(--text); padding: 10px 12px; font-size: 14px;
  box-sizing: border-box; font-family: 'Nunito', sans-serif;
}
.modal-input:focus { outline: none; border-color: var(--accent); }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 16px 20px; border-top: 1px solid var(--border);
}
.btn-cancel {
  background: rgba(255,255,255,0.06); border: none; color: var(--text);
  padding: 10px 18px; border-radius: 8px; font-size: 14px;
  cursor: pointer; font-family: 'Nunito', sans-serif;
}
.btn-submit {
  background: var(--accent); border: none; color: #0d1117;
  padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 800;
  cursor: pointer; font-family: 'Nunito', sans-serif;
}
.btn-submit:hover { background: #3ab8ae; }

/* ─── DEMO BANNER ─── */
.demo-banner {
  background: linear-gradient(135deg, rgba(79,209,197,0.12), rgba(249,115,22,0.08));
  border: 1px solid rgba(79,209,197,0.3);
  border-radius: 10px; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px; font-size: 13px; color: var(--muted);
}
.demo-tag {
  background: var(--accent); color: #0d1117;
  padding: 2px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 900; letter-spacing: 1px; flex-shrink: 0;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .mobile-nav { display: flex !important; }
  #content { padding-bottom: 90px; }
  .kpi-grid { grid-template-columns: repeat(2,1fr); }

  .snapshot-panel { width: 100%; }
  .tab-bar { display: none; }
  .search-wrap { display: none; }
  .brand-name { display: none; }
}
@media (min-width: 769px) {
  .hamburger { display: flex; }
}

function miniCal() {
  const month = 5, year = 2025;
  const days = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  const firstDay = new Date(year, month-1, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(year, month, 0).getDate();
  let html = `<div class="cal-head"><button class="cal-btn">&#8249;</button><span class="cal-title">May 2025</span><button class="cal-btn">&#8250;</button></div>`;
  html += `<div class="cal-grid">${days.map(d=>`<div class="cal-lbl">${d}</div>`).join('')}`;
  for(let i=0;i<offset;i++) html += `<div class="cal-cell"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ev = DATA.calEvents[d] || [];
    const isToday = d === 14;
    html += `<div class="cal-cell${isToday?' today':''}">
      <span class="day-num">${d}</span>
      ${ev.length ? `<div class="cal-dot-row">${ev.map(e=>`<span class="dot dot-${e.type}"></span>`).join('')}</div>` : ''}
    </div>`;
  }
  html += `</div>`;
  return html;
}

      <span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:#a78bfa;display:inline-block"></span> Assignment</span>
      <span style="display:flex;align-items:center;gap:6px;"><span style="width:10px;height:10px;border-radius:50%;background:#f59e0b;display:inline-block"></span> Reminder</span>
    </div>
    <div class="cal-full-grid">
      ${days.map(d=>`<div style="text-align:center;font-size:11px;font-weight:800;color:#555e6a;padding:8px 0;text-transform:uppercase">${d}</div>`).join('')}
      ${Array(offset).fill(`<div class="cal-full-cell empty"></div>`).join('')}
      ${Array.from({length:total},(_,i)=>{
        const d=i+1;
        const evs = DATA.calEvents[d]||[];
        const isToday = d===14;
        return `<div class="cal-full-cell${isToday?' today':''}" onclick="${evs.length?`showToast('${evs[0].label}')`:'openNewEvent()'}">
          <div class="cal-day-num2">${d}</div>
          ${evs.map(e=>`<div class="cal-event-pill" style="background:${colors[e.type]};color:${textC[e.type]}">${e.label}</div>`).join('')}
        </div>`;}).join('')}
    </div>
  `;
}
function openNewEvent() {
  openModal('Add to Calendar', `
    <label class="modal-label">Title</label>
    <input class="modal-input" placeholder="e.g. Mark assignments">
    <label class="modal-label">Date</label>
    <input type="date" class="modal-input" value="2025-05-16">
    <label class="modal-label">Type</label>
    <select class="modal-input"><option>Personal Reminder</option><option>Academic Event</option></select>
  `, () => showToast('Event added to calendar!'));
}
