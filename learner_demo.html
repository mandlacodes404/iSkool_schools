<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/icon.svg?v=1.2">
<title>iSkool LMS – Learner Demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #0d1117;
  --surface: #1a1919;
  --surface2: #161b22;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(190,188,188,0.08);
  --accent: #4fd1c5;
  --accent-dim: rgba(79,209,197,0.08);
  --secondary: #f6877a;
  --text: #e2e8f0;
  --muted: #8b949e;
  --danger: #f85149;
  --green: #22c55e;
  --purple: #a78bfa;
  --yellow: #f59e0b;
  --orange: #e67e22;
  --sidebar-w: 260px;
  --header-h: 60px;
  --radius: 16px;
  --t: 0.3s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  font-weight: 600;
  position: fixed;
  width: 100%;
  top: 0;
  left: 0;
}

/* ─── SPLASH SCREEN ─── */
#splash {
  position: fixed; inset: 0;
  background: #1a1919;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 99999;
  transition: opacity 0.8s ease;
  height: 100vh;
  height: 100dvh;
}
#splash.fade-out { opacity: 0; pointer-events: none; }
#splash-logo {
  animation: splashReveal 0.8s ease-out forwards;
}
@keyframes splashReveal {
  from { opacity: 0; transform: scale(0.85); }
  to   { opacity: 1; transform: scale(1); }
}
#splash-logo svg { width: 140px; height: 140px; }

/* ─── PERSONALISE SCREEN ─── */
#personalise {
  position: fixed; inset: 0;
  background: #1a1919;
  display: none;
  flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 99998;
  opacity: 0;
  transition: opacity 0.6s ease;
  padding: 24px;
}
#personalise.show { display: flex; opacity: 1; }
.pers-logo { margin-bottom: 28px; }
.pers-logo svg { width: 72px; height: 72px; }
.pers-title {
  font-size: 22px; font-weight: 900; color: #fff;
  margin-bottom: 6px; text-align: center;
}
.pers-sub {
  font-size: 14px; color: #8b949e;
  margin-bottom: 32px; text-align: center; line-height: 1.6;
}
.pers-form { width: 100%; max-width: 400px; }
.pers-input {
  width: 100%; background: #1E1F20;
  border: 1px solid #30363d; border-radius: 30px;
  color: #fff; padding: 14px 22px;
  font-size: 15px; font-family: 'Nunito', sans-serif;
  font-weight: 600; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  display: block; margin-bottom: 14px;
}
.pers-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,209,197,0.15);
}
.pers-input::placeholder { color: #555e6a; }
.pers-btn {
  width: 100%; background: #fff; color: #131314;
  border: none; border-radius: 24px; padding: 15px;
  font-size: 16px; font-weight: 800; font-family: 'Nunito', sans-serif;
  cursor: pointer; transition: background 0.2s, transform 0.15s;
  margin-top: 4px;
}
.pers-btn:hover { background: #f1f1f1; transform: translateY(-1px); }
.pers-btn:active { transform: translateY(0); }
.pers-note {
  text-align: center; font-size: 12px; color: #555e6a;
  margin-top: 16px; line-height: 1.5;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  padding: 20px;
  position: fixed;
  top: 0; left: -100%;
  height: 100vh;
  height: 100dvh;
  z-index: 5000;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
  border-top-right-radius: 20px;
  border-bottom-right-radius: 20px;
  border-right: 1px solid var(--border2);
  transition: left var(--t);
  visibility: hidden; opacity: 0;
}
.sidebar::-webkit-scrollbar { display: none; }
.sidebar.open { left: 0; visibility: visible; opacity: 1; }

.sb-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.avatar-wrap {
  width: 44px; height: 44px; border-radius: 50%;
  background: #121212; border: 2px solid #8b8989;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #8b8989;
  text-transform: uppercase; cursor: pointer; overflow: hidden; flex-shrink: 0;
}
.sb-close {
  width: 38px; height: 38px; border-radius: 50%;
  background: #000; border: 2px solid #333; color: var(--text);
  font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.sb-close:hover { background: #111; }
.learner-name { font-size: 18px; font-weight: 800; color: #fff; margin-top: 6px; }
.learner-email { font-size: 12px; color: var(--muted); margin-top: 2px; margin-bottom: 4px; }

.sb-links { margin-top: 18px; display: flex; flex-direction: column; gap: 2px; }
.sb-link {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 12px;
  color: #b2b5b9; text-decoration: none; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; border: none; background: none;
  width: 100%; text-align: left; font-family: 'Nunito', sans-serif;
}
.sb-link:hover { background: var(--accent-dim); color: #fff; transform: translateX(2px); }
.sb-link.active { background: rgba(79,209,197,0.15); box-shadow: inset 4px 0 0 0 #8b949e; }
.sb-link svg { flex-shrink: 0; }
.sb-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border); font-size: 13px; color: #555; text-align: center; letter-spacing: 1px; }

/* ─── OVERLAY ─── */
#overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 4999; opacity: 0; pointer-events: none; transition: opacity var(--t); }
#overlay.show { opacity: 1; pointer-events: all; }

/* ─── MAIN ─── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; min-height: 0; }

/* ─── HEADER ─── */
.main-header {
  height: var(--header-h);
  background: rgba(26,25,25,0.98);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  flex-shrink: 0;
  z-index: 1000;
}
.header-left { flex: 1; display: flex; align-items: center; gap: 10px; }
.header-brand { flex: 2; display: flex; justify-content: center; align-items: center; gap: 10px; }
.brand-logo {
  width: 38px; height: 38px; border-radius: 8px;
  border: 2px solid #757272;
  background: linear-gradient(135deg,#1a3a3a,#0d2424);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: var(--accent);
}
.brand-school { font-size: 16px; font-weight: 700; color: var(--text); }
.header-right { flex: 1; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }

.hdr-btn {
  background: none; border: none; color: var(--text);
  cursor: pointer; padding: 8px;
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s, background 0.2s;
  border-radius: 8px;
}
.hdr-btn:hover { color: var(--accent); background: var(--accent-dim); }

#demoCalIconBtn { display: none; }

.menu-btn {
  background: #000; border: 2px solid #333; color: var(--text);
  width: 38px; height: 38px; border-radius: 19%;
  cursor: pointer; display: none; align-items: center; justify-content: center;
  transition: all 0.2s; flex-shrink: 0;
}
.menu-btn:hover { background: #111; }

/* ─── CONTENT ─── */
#content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px; padding-bottom: 100px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
#content::-webkit-scrollbar { width: 6px; }
#content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
#content::-webkit-scrollbar-thumb:hover { background: rgba(79,209,197,0.5); }

/* ─── DISCUSSION FULL-HEIGHT WRAPPER ─── */
#content.disc-mode {
  padding: 0;
  overflow: hidden;
}

/* ─── MOBILE BOTTOM NAV ─── */
.mob-nav {
  display: none; position: fixed; bottom: 0; left: 0; width: 100%;
  background: rgba(27,27,27,0.97);
  backdrop-filter: blur(20px);
  border-top: 3px solid rgba(255,255,255,0.12);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  z-index: 4000; justify-content: space-around; align-items: flex-start;
  padding-top: 8px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: calc(68px + env(safe-area-inset-bottom, 0px));
}
.mob-tab {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 4px;
  color: var(--muted); font-size: 10px; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
  border: none; background: none; font-family: 'Nunito', sans-serif;
}
.mob-tab.active, .mob-tab:hover { color: var(--accent); transform: translateY(-3px); }

/* ─── DEMO BANNER ─── */
.demo-banner {
  background: linear-gradient(135deg, rgba(79,209,197,0.1), rgba(246,135,122,0.07));
  border: 1px solid rgba(79,209,197,0.25);
  border-radius: 10px; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px; font-size: 13px; color: var(--muted);
}
.demo-tag { background: var(--accent); color: #0d1117; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 900; letter-spacing: 1px; flex-shrink: 0; }

/* ─── HOME ─── */
.manual-container { max-width: 800px; margin: 0 auto; }
.manual-greeting { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 4px; }
.manual-sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
.quick-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
.stat-card:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.stat-num { font-size: 28px; font-weight: 900; }
.stat-lbl { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.section-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; }
.section-card:hover { border-color: rgba(79,209,197,0.3); transform: translateX(4px); }
.sc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sc-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sc-title { font-size: 15px; font-weight: 800; color: var(--text); }
.sc-body { font-size: 13px; color: var(--muted); line-height: 1.5; padding-left: 50px; }

/* ─── HOME LAYOUT ─── */
.learner-home-wrapper { display: flex; gap: 20px; align-items: flex-start; }
.learner-home-left { width: 30%; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
.learner-home-right { flex: 1; min-width: 0; }
.learner-home-panel { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
.learner-home-panel-title { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.learner-home-activity-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); transition: opacity 0.2s; }
.learner-home-activity-item:last-child { border-bottom: none; }
.learner-home-activity-item:hover { opacity: 0.8; }
.learner-home-activity-icon { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.learner-home-activity-title { font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.learner-home-activity-meta { font-size: 11px; color: var(--muted); }
.learner-home-todo-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); transition: opacity 0.2s; }
.learner-home-todo-item:last-child { border-bottom: none; }
.learner-home-todo-item:hover { opacity: 0.8; }
.learner-home-todo-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.learner-home-todo-title { font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.learner-home-todo-meta { font-size: 11px; color: var(--muted); }
.learner-home-todo-info { flex: 1; min-width: 0; }
.learner-home-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 16px 0; font-style: italic; }

/* ─── MINI CALENDAR ─── */
.demo-mini-cal { width: 100%; }
.demo-cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.demo-cal-month { font-size: 13px; font-weight: 800; color: #e2e8f0; }
.demo-cal-nav { background: none; border: none; color: #8b949e; font-size: 18px; cursor: pointer; line-height: 1; padding: 0 4px; transition: color 0.2s; }
.demo-cal-nav:hover { color: #4fd1c5; }
.demo-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.demo-cal-day-label { text-align: center; font-size: 9px; font-weight: 800; color: #555e6a; padding: 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
.demo-cal-cell { display: flex; flex-direction: column; align-items: center; min-height: 34px; padding: 3px 1px; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
.demo-cal-cell:hover { background: rgba(255,255,255,0.05); }
.demo-cal-cell.empty { cursor: default; pointer-events: none; }
.demo-cal-num { font-size: 11px; font-weight: 600; color: #8b949e; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
.demo-cal-cell.is-today .demo-cal-num { background: #4fd1c5; color: #0d1117; font-weight: 900; }
.demo-cal-cell.has-events .demo-cal-num { color: #e2e8f0; }
.demo-cal-dots { display: flex; gap: 2px; margin-top: 2px; }
.demo-dot { width: 5px; height: 5px; border-radius: 50%; display: block; flex-shrink: 0; }
.demo-dot-quiz       { background: #4fd1c5; }
.demo-dot-assignment { background: #a78bfa; }
.demo-dot-academic   { background: #f472b6; }
.demo-cal-legend { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.demo-cal-legend span { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: #8b949e; }

/* ─── FULL CALENDAR PAGE ─── */
.lcal-topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
.lcal-header-left { display: flex; flex-direction: column; gap: 8px; }
.lcal-page-title { font-size: 22px; font-weight: 900; color: #4fd1c5; margin: 0; }
.lcal-legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.lcal-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #8b949e; }
.lcal-legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.lcal-back-btn {
  display: inline-flex; align-items: center; gap: 7px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  color: #e2e8f0; padding: 9px 16px; border-radius: 8px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  font-family: 'Nunito', sans-serif; transition: background 0.2s;
}
.lcal-back-btn:hover { background: rgba(255,255,255,0.09); }
.lcal-body { display: flex; gap: 20px; align-items: flex-start; }
.lcal-main { flex: 1; min-width: 0; background: #1a1919; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; overflow: hidden; }
.lcal-nav-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.lcal-nav-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #8b949e; width: 34px; height: 34px; border-radius: 8px; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; transition: all 0.2s; font-family: 'Nunito', sans-serif; }
.lcal-nav-btn:hover { background: rgba(79,209,197,0.1); border-color: rgba(79,209,197,0.3); color: #4fd1c5; }
.lcal-month-label { font-size: 17px; font-weight: 900; color: #e2e8f0; }
.lcal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid rgba(255,255,255,0.06); }
.lcal-day-header { text-align: center; font-size: 11px; font-weight: 800; color: #555e6a; padding: 10px 4px; text-transform: uppercase; letter-spacing: 0.8px; border-right: 1px solid rgba(255,255,255,0.03); }
.lcal-day-header:last-child { border-right: none; }
.lcal-cells { display: grid; grid-template-columns: repeat(7, 1fr); }
.lcal-cell { min-height: 90px; padding: 8px; border-right: 1px solid rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; gap: 4px; transition: background 0.2s; }
.lcal-cell:nth-child(7n) { border-right: none; }
.lcal-cell-empty { background: rgba(0,0,0,0.1); pointer-events: none; }
.lcal-cell-today { background: rgba(79,209,197,0.05); }
.lcal-cell-top { display: flex; align-items: center; justify-content: space-between; }
.lcal-day-num { font-size: 13px; font-weight: 700; color: #8b949e; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
.lcal-cell-today .lcal-day-num { background: #4fd1c5; color: #0d1117; font-weight: 900; }
.lcal-cell-has-events .lcal-day-num { color: #e2e8f0; }
.lcal-dots { display: flex; gap: 3px; align-items: center; }
.lcal-dot { width: 5px; height: 5px; border-radius: 50%; display: block; flex-shrink: 0; }
.lcal-pills { display: flex; flex-direction: column; gap: 3px; }
.lcal-pill { font-size: 11px; font-weight: 700; padding: 3px 7px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
.lcal-pill-more { background: rgba(255,255,255,0.05) !important; color: #8b949e !important; font-size: 10px; }
.lcal-upcoming { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
.lcal-upcoming-label { font-size: 11px; font-weight: 800; color: #8b949e; text-transform: uppercase; letter-spacing: 1.5px; }
.lcal-upcoming-card { background: #1a1919; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 12px 14px; transition: border-color 0.2s, transform 0.2s; }
.lcal-upcoming-card:hover { border-color: rgba(79,209,197,0.2); transform: translateY(-2px); }
.lcal-upcoming-type { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 5px; }
.lcal-upcoming-title { font-size: 13px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; line-height: 1.3; }
.lcal-upcoming-meta { font-size: 11px; color: #555e6a; }
.lcal-upcoming-date { font-size: 12px; font-weight: 800; margin-top: 6px; }
.lcal-upcoming-empty { background: #1a1919; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 20px; text-align: center; font-size: 13px; color: #555e6a; }

/* ─── OTHER PAGES ─── */
.quiz-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; transition: border-color 0.2s; }
.quiz-card:hover { border-color: rgba(79,209,197,0.25); }
.quiz-card h4 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.quiz-info-text { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.subj-head { font-size: 14px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 4px; }
.q-action-start { color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
.q-action-done { color: var(--green); font-weight: 700; font-size: 13px; }
.q-action-closed { color: var(--muted); font-weight: 700; font-size: 13px; }
.q-action-progress { color: var(--orange); font-weight: 700; font-size: 13px; cursor: pointer; }
.inst-container { max-width: 700px; margin: auto; background: #1b1b1b; padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
.quiz-info-box { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 18px; border-radius: 10px; margin-bottom: 25px; color: var(--muted); }
.quiz-info-box p { margin: 6px 0; font-size: 14px; }
.quiz-info-box strong { color: var(--text); }
.inst-list { list-style: none; padding: 0; }
.inst-list li { margin-bottom: 12px; color: var(--muted); position: relative; padding-left: 24px; font-size: 14px; }
.inst-list li::before { content: "•"; color: var(--accent); position: absolute; left: 0; font-weight: bold; }
.ai-box { background: rgba(79,209,197,0.05); border: 1px solid rgba(79,209,197,0.3); border-radius: 10px; padding: 15px; margin-top: 25px; }
.start-btn { background: rgba(79,209,197,0.1); color: var(--text); padding: 14px 30px; border: 1px solid rgba(255,255,255,0.05); border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; max-width: 320px; display: block; margin: 35px auto 0; transition: 0.3s; font-family: 'Nunito', sans-serif; font-size: 15px; }
.start-btn:hover { border-color: var(--accent); background: rgba(79,209,197,0.2); }
.assign-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; transition: border-color 0.2s; }
.assign-card:hover { border-color: rgba(79,209,197,0.25); }
.assign-info { flex: 1; }
.assign-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.assign-meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.assign-desc { font-size: 13px; color: #bbb; line-height: 1.5; margin-bottom: 10px; }
.assign-links { display: flex; gap: 12px; flex-wrap: wrap; }
.assign-link { color: var(--accent); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.assign-action { white-space: nowrap; font-weight: 700; font-size: 13px; padding-top: 4px; }
.grades-wrap { max-width: 780px; margin: 0 auto; }
.grades-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.grades-title { font-size: 20px; font-weight: 800; color: var(--text); }
.grades-report-btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(79,209,197,0.3); border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Nunito', sans-serif; transition: all 0.2s; }
.grades-report-btn:hover { background: rgba(79,209,197,0.2); }
.subject-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.subject-header { display: flex; align-items: center; gap: 12px; padding: 18px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; }
.subject-header:hover { background: rgba(255,255,255,0.02); }
.subject-name { flex: 1; font-size: 16px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
.subject-count { font-size: 12px; color: var(--muted); font-weight: 600; background: rgba(255,255,255,0.05); padding: 2px 8px; border-radius: 20px; }
.subject-chev { transition: transform 0.3s; color: #4a5568; }
.subject-chev.open { transform: rotate(90deg); }
.view-toggle-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px 6px; border-bottom: 1px solid rgba(255,255,255,0.04); }
.vt-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted); font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif; text-transform: uppercase; letter-spacing: 0.8px; cursor: pointer; padding: 6px 10px; border-radius: 8px; transition: all 0.2s; }
.vt-btn:hover { background: var(--accent-dim); color: var(--accent); }
.vt-btn.active-view { color: var(--accent); background: var(--accent-dim); }
.quiz-list { padding: 8px 16px 16px; }
.quiz-row { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); border-radius: 10px; margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s, transform 0.2s; }
.quiz-row:hover { border-color: rgba(79,209,197,0.2); transform: translateX(3px); }
.quiz-row-header { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
.quiz-row-title { flex: 1; font-size: 14px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.score-pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; }
.score-high { background: rgba(34,197,94,0.15); color: var(--green); }
.score-mid { background: rgba(79,209,197,0.15); color: var(--accent); }
.score-low { background: rgba(248,81,73,0.15); color: var(--danger); }
.score-pending { background: rgba(255,255,255,0.05); color: #4a5568; }
.quiz-row-details { display: none; padding: 12px 16px 14px; border-top: 1px solid rgba(255,255,255,0.04); background: rgba(0,0,0,0.2); font-size: 13px; color: var(--muted); line-height: 1.7; }
.quiz-row-details p { margin: 2px 0; }
.quiz-row-details strong { color: #c9d1d9; }
.view-details-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(79,209,197,0.2); padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif; cursor: pointer; margin-top: 6px; }
.term-table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
.term-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.term-table th { padding: 10px 14px; text-align: left; color: var(--accent); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); }
.term-table th:not(:first-child) { text-align: center; }
.term-table td { padding: 10px 14px; color: #c9d1d9; border-bottom: 1px solid rgba(255,255,255,0.04); }
.term-table td:not(:first-child) { text-align: center; }
.term-table tr:last-child td { border-bottom: none; }
.term-total td { font-weight: 800; color: var(--accent); border-top: 2px solid rgba(79,209,197,0.3) !important; }
.resource-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
.resource-card:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.res-info { flex: 1; }
.res-name { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 4px; }
.res-meta { font-size: 12px; color: var(--muted); }
.ann-flat-card {
  display: flex; align-items: flex-start; gap: 14px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
  cursor: pointer; transition: border-color 0.2s, transform 0.2s;
}
.ann-flat-card:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.ann-flat-icon { flex-shrink: 0; margin-top: 2px; }
.ann-flat-info { flex: 1; }
.ann-flat-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.ann-flat-preview { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
.ann-flat-date { font-size: 12px; color: #555e6a; }
.eval-form { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 16px; }
.eval-q { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 16px; border-left: 4px solid var(--accent); padding-left: 12px; }
.eval-options { display: flex; flex-direction: column; gap: 8px; }
.eval-option { padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.07); font-size: 14px; color: #c9d1d9; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 10px; }
.eval-option:hover { border-color: rgba(79,209,197,0.3); background: var(--accent-dim); }
.eval-option.selected { border-color: var(--accent); background: rgba(79,209,197,0.12); color: var(--text); }
.eval-option-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); flex-shrink: 0; }
.eval-option.selected .eval-option-dot { background: var(--accent); border-color: var(--accent); }
.eval-submit { background: var(--accent); color: #0d1117; border: none; padding: 12px 24px; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; margin-top: 20px; display: block; width: 100%; }
.eval-submit:hover { background: #3ab8ae; }
.syl-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.syl-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.2s; }
.syl-head:hover { background: rgba(255,255,255,0.02); }
.syl-class-name { font-size: 15px; font-weight: 700; color: var(--accent); }
.syl-body { padding: 16px 18px; }
.syl-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.syl-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #30363d; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.syl-check.done { background: var(--accent); border-color: var(--accent); color: #0d1117; }
.syl-topic { font-size: 14px; color: #c9d1d9; }
.syl-topic.done { text-decoration: line-through; opacity: 0.5; }
.settings-wrap { max-width: 460px; margin: 0 auto; }
.settings-avatar-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
.settings-avatar { width: 96px; height: 96px; border-radius: 50%; background: #1b1b1b; border: 3px solid #30363d; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: var(--muted); cursor: pointer; }
.settings-hint { margin-top: 10px; font-size: 13px; color: var(--muted); }
.settings-card { background: #1b1b1b; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background 0.2s; }
.settings-card:hover { background: #21262d; }
.settings-card-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.settings-card-info { flex: 1; }
.settings-card-name { font-size: 14px; font-weight: 700; color: var(--text); }
.settings-card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ─── TOAST / MODAL ─── */
.toast { position: fixed; bottom: 80px; right: 20px; background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: 700; color: var(--text); z-index: 9999; display: none; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9000; display: none; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--surface); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); width: 90%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 700; color: var(--accent); }
.modal-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
.modal-body { padding: 20px; font-size: 14px; color: #c9d1d9; line-height: 1.7; }
.modal-foot { display: flex; justify-content: flex-end; padding: 16px 20px; border-top: 1px solid var(--border); }
.modal-ok { background: var(--accent); border: none; color: #0d1117; padding: 10px 22px; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: 'Nunito', sans-serif; }

/* ─── DISCUSSION STYLES ─── */
/* Desktop split layout */
.disc-split-wrap {
  display: flex;
  height: calc(100vh - var(--header-h));
  overflow: hidden;
}
.disc-sidebar-panel {
  width: 300px;
  min-width: 260px;
  max-width: 320px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: #111;
  border-right: 1px solid rgba(255,255,255,0.07);
}
.disc-sidebar-head {
  padding: 14px 14px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.disc-sidebar-head span {
  font-size: 13px; font-weight: 700; color: #e2e8f0;
  font-family: 'Nunito', sans-serif;
}
.disc-new-btn {
  background: rgba(79,209,197,0.1); color: #4fd1c5;
  border: 1px solid rgba(79,209,197,0.3);
  padding: 5px 12px; border-radius: 7px; cursor: pointer;
  font-weight: 700; font-family: 'Nunito', sans-serif;
  font-size: 12px; transition: background 0.15s; white-space: nowrap;
}
.disc-new-btn:hover { background: rgba(79,209,197,0.2); }
.disc-sidebar-list {
  flex: 1; overflow-y: auto; padding: 6px;
  scrollbar-width: thin; scrollbar-color: #1b1b1b transparent;
}
.dsk-item {
  padding: 11px 12px; border-radius: 8px; cursor: pointer;
  margin-bottom: 2px; border: 1px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}
.dsk-item:hover { background: rgba(255,255,255,0.04); }
.dsk-item.active {
  background: rgba(79,209,197,0.07);
  border-color: rgba(79,209,197,0.2);
}
.dsk-item-title {
  font-size: 12px; font-weight: 700; color: #e2e8f0;
  font-family: 'Nunito', sans-serif;
  line-height: 1.35; margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dsk-item.active .dsk-item-title { color: #4fd1c5; }
.dsk-item-meta {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: #8b949e; font-family: 'Nunito', sans-serif;
}
.dsk-item-pill {
  background: rgba(79,209,197,0.1); color: #4fd1c5;
  padding: 1px 6px; border-radius: 10px;
  font-size: 9px; font-weight: 700;
}
.dsk-item-preview {
  font-size: 10px; color: #8b949e;
  font-family: 'Nunito', sans-serif;
  margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.disc-thread-panel {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: #0f0f0f;
}
.disc-empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 10px; color: #8b949e;
  font-family: 'Nunito', sans-serif; height: 100%;
}
.disc-empty-state i { font-size: 36px; color: rgba(79,209,197,0.2); }
.disc-empty-state p { font-size: 13px; font-weight: 600; }
.disc-empty-state small { font-size: 11px; color: #555; }

/* Thread */
.disc-thread-wrap { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
.disc-thread-head {
  padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.07);
  flex-shrink: 0; background: #111;
}
.disc-thread-head-title { font-size: 14px; font-weight: 700; color: #e2e8f0; font-family: 'Nunito', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.disc-thread-head-meta { font-size: 11px; color: #8b949e; font-family: 'Nunito', sans-serif; margin-top: 2px; }
.disc-posts-scroll {
  flex: 1; overflow-y: auto; padding: 16px 16px 8px;
  display: flex; flex-direction: column; gap: 0;
  scrollbar-width: thin; scrollbar-color: #1b1b1b transparent;
}
.disc-date-sep { display: flex; align-items: center; justify-content: center; margin: 16px 0 10px; }
.disc-date-sep span {
  font-size: 10px; font-weight: 700; color: #8b949e;
  background: #141414; border: 1px solid rgba(255,255,255,0.07);
  padding: 3px 12px; border-radius: 20px;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.disc-post-card {
  display: flex; gap: 12px; padding-bottom: 16px;
  position: relative;
  animation: discFadeUp 0.25s ease both;
}
@keyframes discFadeUp { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
.disc-spine {
  display: flex; flex-direction: column;
  align-items: center; width: 28px; flex-shrink: 0; padding-top: 2px;
}
.disc-spine-dot { width: 9px; height: 9px; border-radius: 50%; background: #4fd1c5; flex-shrink: 0; }
.disc-spine-dot.muted { background: #2a2a2a; border: 1px solid rgba(255,255,255,0.1); }
.disc-spine-dot.is-op-dot { background: #4fd1c5; box-shadow: 0 0 0 3px rgba(79,209,197,0.15); }
.disc-spine-line { width: 1px; flex: 1; background: rgba(255,255,255,0.07); margin-top: 4px; min-height: 24px; }
.disc-post-card:last-child .disc-spine-line { display: none; }
.disc-post-content { flex: 1; min-width: 0; }
.disc-post-header { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; flex-wrap: wrap; }
.disc-avatar { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.1); flex-shrink: 0; background: #333; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #8b949e; text-transform: uppercase; }
.disc-author { font-size: 13px; font-weight: 700; color: #e2e8f0; }
.disc-time { font-size: 10px; color: #8b949e; margin-left: auto; white-space: nowrap; }
.disc-tag { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.04em; }
.disc-tag.op { background: rgba(79,209,197,0.12); color: #4fd1c5; border: 1px solid rgba(79,209,197,0.25); }
.disc-tag.me { background: rgba(79,209,197,0.12); color: #4fd1c5; border: 1px solid rgba(79,209,197,0.25); }
.disc-tag.anon { background: rgba(255,255,255,0.05); color: #8b949e; border: 1px solid rgba(255,255,255,0.1); }
.disc-body-wrap {
  background: #1a1919; border: 1px solid rgba(255,255,255,0.07);
  border-radius: 0 10px 10px 10px; padding: 10px 13px;
}
.disc-body-wrap.is-op { background: rgba(79,209,197,0.04); border-color: rgba(79,209,197,0.15); }
.disc-body-wrap.is-me { border-color: rgba(79,209,197,0.2); }
.disc-quote {
  background: rgba(255,255,255,0.03); border-left: 2px solid #4fd1c5;
  border-radius: 0 6px 6px 0; padding: 6px 10px; margin-bottom: 8px;
  font-size: 11px; color: #8b949e;
}
.disc-quote-author { color: #4fd1c5; font-weight: 700; margin-bottom: 1px; font-size: 10px; }
.disc-body { font-size: 13px; line-height: 1.65; color: #e2e8f0; word-wrap: break-word; white-space: pre-wrap; }
.disc-footer { display: flex; align-items: center; gap: 2px; margin-top: 6px; }
.disc-action-btn {
  background: none; border: none; color: #8b949e; font-size: 11px; font-weight: 700;
  cursor: pointer; padding: 3px 8px; border-radius: 5px;
  display: flex; align-items: center; gap: 4px;
  font-family: 'Nunito', sans-serif; transition: 0.15s;
}
.disc-action-btn:hover { background: rgba(255,255,255,0.05); color: #e2e8f0; }
.disc-action-btn.reply:hover { color: #4fd1c5; }
.disc-compose {
  flex-shrink: 0; padding: 10px 16px 12px;
  border-top: 1px solid rgba(255,255,255,0.07); background: #111;
}
.disc-reply-preview {
  display: none; background: rgba(79,209,197,0.06);
  border: 1px solid rgba(79,209,197,0.2); border-radius: 8px;
  padding: 7px 11px; margin-bottom: 7px; font-size: 11px; color: #8b949e;
  align-items: center; gap: 8px;
}
.disc-reply-preview.show { display: flex; }
.disc-compose-box {
  background: #1b1b1b; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px; overflow: hidden; transition: border-color 0.2s;
}
.disc-compose-box:focus-within { border-color: rgba(79,209,197,0.4); }
.disc-compose-box textarea {
  width: 100%; background: transparent; border: none; color: #e2e8f0;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 600;
  padding: 11px 13px 8px; resize: none; outline: none;
  min-height: 42px; max-height: 120px; line-height: 1.5; box-sizing: border-box;
}
.disc-compose-box textarea::placeholder { color: #8b949e; }
.disc-toolbar {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 9px; border-top: 1px solid rgba(255,255,255,0.07);
}
.disc-anon-label {
  display: flex; align-items: center; gap: 5px;
  background: none; border: none; color: #4fd1c5; cursor: pointer;
  padding: 5px 7px; border-radius: 6px; transition: 0.15s;
  font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700;
}
.disc-anon-label:hover { background: rgba(255,255,255,0.06); }
.disc-post-btn {
  background: #4fd1c5; color: #0d1117; border: none;
  padding: 6px 14px; border-radius: 8px;
  font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
  margin-left: auto; transition: 0.2s;
}
.disc-post-btn:hover { background: #38b2ac; }

/* Mobile discussion list */
.mob-disc-list { padding: 0; }
.mob-disc-item {
  background: #1b1b1b; border: 1px solid rgba(255,255,255,0.06);
  padding: 18px 16px; border-radius: 12px; cursor: pointer;
  transition: border-color 0.2s, transform 0.15s;
  margin-bottom: 10px;
}
.mob-disc-item:hover { border-color: rgba(79,209,197,0.3); transform: translateY(-2px); }
.mob-disc-title { font-size: 15px; font-weight: 800; color: #e2e8f0; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.02em; }
.mob-disc-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: #8b949e; margin-bottom: 8px; }
.mob-disc-replies { background: rgba(79,209,197,0.1); color: #4fd1c5; padding: 2px 10px; border-radius: 12px; font-weight: 700; font-size: 12px; }
.mob-disc-preview { font-size: 13px; color: #abb2bf; line-height: 1.5; }

/* Mobile thread back button */
.disc-mob-back {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.07);
  background: #111; flex-shrink: 0;
}
.disc-mob-back-btn {
  background: none; border: none; color: #4fd1c5; cursor: pointer;
  font-size: 13px; font-weight: 700; font-family: 'Nunito', sans-serif;
  display: flex; align-items: center; gap: 6px; padding: 4px 0;
}
.disc-mob-back-title { font-size: 13px; font-weight: 700; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .mob-nav { display: flex !important; }
  #content { padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px)); }
  #desktopBtn { display: none !important; }
  #mobileBtn { display: flex !important; }
  .brand-school { display: none; }
  .learner-home-wrapper { flex-direction: column; }
  .learner-home-left { width: 100%; }
  .lcal-body { flex-direction: column; }
  .lcal-upcoming { width: 100%; }
  #demoCalIconBtn { display: none !important; }
}
@media (min-width: 769px) {
  #mobileBtn { display: none !important; }
  #desktopBtn { display: flex !important; }
  .lcal-cell { min-height: 90px; }
}
</style>

function getInitials(fullName) {
  const parts = fullName.trim().split(/\s+/);
  if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}
function getFirstName(fullName) { return fullName.trim().split(/\s+/)[0]; }
function getSchoolInitials(school) { return school.trim().split(/\s+/).map(w => w[0]).join('').substring(0, 3).toUpperCase(); }

// ── MINI CALENDAR ──
function buildDemoMiniCal() {
  const { month, year } = calState;
  const dayLabels = ['Mo','Tu','We','Th','Fr','Sa','Su'];
  const firstDay  = new Date(year, month - 1, 1).getDay();
  const offset    = firstDay === 0 ? 6 : firstDay - 1;
  const total     = new Date(year, month, 0).getDate();
  const key       = `${year}-${String(month).padStart(2,'0')}`;
  const evs       = DEMO_CAL_EVENTS[key] || [];
  const eventMap  = {};
  evs.forEach(e => { if (!eventMap[e.day]) eventMap[e.day] = []; eventMap[e.day].push(e); });
  const todayDemo = (month === 5 && year === 2025) ? 14 : 0;

  let html = `<div class="demo-mini-cal"><div class="demo-cal-header"><button class="demo-cal-nav" onclick="miniCalPrev()">&#8249;</button><span class="demo-cal-month">${['January','February','March','April','May','June','July','August','September','October','November','December'][month-1]} ${year}</span><button class="demo-cal-nav" onclick="miniCalNext()">&#8250;</button></div><div class="demo-cal-grid">`;
  dayLabels.forEach(d => { html += `<div class="demo-cal-day-label">${d}</div>`; });
  for (let i = 0; i < offset; i++) html += `<div class="demo-cal-cell empty"></div>`;
  for (let d = 1; d <= total; d++) {
    const dayEvs = eventMap[d] || [];
    const isToday = d === todayDemo;
    const dots = dayEvs.map(e => {
      const dotClass = e.type === 'quiz' ? 'demo-dot-quiz' : e.type === 'assignment' ? 'demo-dot-assignment' : 'demo-dot-academic';
      return `<span class="demo-dot ${dotClass}"></span>`;
    }).join('');
    html += `<div class="demo-cal-cell ${isToday ? 'is-today' : ''} ${dayEvs.length ? 'has-events' : ''}"><span class="demo-cal-num">${d}</span>${dayEvs.length ? `<div class="demo-cal-dots">${dots}</div>` : ''}</div>`;
  }
  html += `</div><div class="demo-cal-legend"><span><span class="demo-dot demo-dot-quiz"></span> Quiz</span><span><span class="demo-dot demo-dot-assignment"></span> Assignment</span><span><span class="demo-dot demo-dot-academic"></span> Academic</span></div></div>`;
  return html;
}

function miniCalPrev() {
  calState.month--;
  if (calState.month < 1) { calState.month = 12; calState.year--; }
  const panel = document.querySelector('.learner-home-panel:last-child');
  if (panel) {
    const container = panel.querySelector('.demo-mini-cal')?.parentElement;
    if (container) container.innerHTML = `<div class="learner-home-panel-title"><svg viewBox="0 0 24 24" width="14" height="14" stroke="#4fd1c5" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>My Calendar</div>${buildDemoMiniCal()}`;

}
function miniCalNext() {
  calState.month++;

  const panel = document.querySelector('.learner-home-panel:last-child');
  if (panel) {

// ── FULL CALENDAR PAGE ──
function renderCalendarPage() {

function buildFullCalPage(month, year) {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date();
  const firstDay = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  const key = `${year}-${String(month).padStart(2,'0')}`;
  const evs = DEMO_CAL_EVENTS[key] || [];
  const eventMap = {};
  evs.forEach(e => { if (!eventMap[e.day]) eventMap[e.day] = []; eventMap[e.day].push(e); });

  const legend = `<div class="lcal-legend"><span class="lcal-legend-item"><span class="lcal-legend-dot" style="background:#fdd663"></span> Quiz</span><span class="lcal-legend-item"><span class="lcal-legend-dot" style="background:#a78bfa"></span> Assignment</span><span class="lcal-legend-item"><span class="lcal-legend-dot" style="background:#f472b6"></span> Academic</span><span class="lcal-legend-item"><span class="lcal-legend-dot" style="background:#22c55e"></span> Completed</span></div>`;
  const dayHeaders = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div class="lcal-day-header">${d}</div>`).join('');

  let cells = '';
  for (let i = 0; i < offset; i++) cells += `<div class="lcal-cell lcal-cell-empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const isFakeToday = (d === 14 && month === 5 && year === 2025);
    const dayEvs = eventMap[d] || [];
    const hasDots = { quiz_up: dayEvs.some(e => e.type==='quiz'&&e.subtype!=='quiz_done'), quiz_done: dayEvs.some(e=>e.subtype==='quiz_done'), assign: dayEvs.some(e=>e.type==='assignment'), academic: dayEvs.some(e=>e.type==='academic') };
    const visible = dayEvs.slice(0,3); const overflow = dayEvs.length - 3;
    const pills = visible.map(e => {
      let bg, color;
      if (e.type==='assignment'){bg='rgba(167,139,250,0.15)';color='#a78bfa';}
      else if(e.subtype==='quiz_done'){bg='rgba(34,197,94,0.15)';color='#22c55e';}
      else if(e.type==='quiz'){bg='rgba(253,214,99,0.15)';color='#fdd663';}
      else{bg='rgba(244,114,182,0.15)';color='#f472b6';}
      return `<div class="lcal-pill" style="background:${bg};color:${color}">${e.title}</div>`;
    }).join('');
    const dots = `<div class="lcal-dots">${hasDots.quiz_up?'<span class="lcal-dot" style="background:#fdd663"></span>':''}${hasDots.quiz_done?'<span class="lcal-dot" style="background:#22c55e"></span>':''}${hasDots.assign?'<span class="lcal-dot" style="background:#a78bfa"></span>':''}${hasDots.academic?'<span class="lcal-dot" style="background:#f472b6"></span>':''}</div>`;
    cells += `<div class="lcal-cell ${isFakeToday?'lcal-cell-today':''} ${dayEvs.length?'lcal-cell-has-events':''}"><div class="lcal-cell-top"><span class="lcal-day-num">${d}</span>${dots}</div><div class="lcal-pills">${pills}${overflow>0?`<div class="lcal-pill lcal-pill-more">+${overflow} more</div>`:''}</div></div>`;
  }

  const allUpcoming = evs.filter(e => e.day >= 14 || month !== 5).sort((a,b)=>a.day-b.day).slice(0,6);
  const upcomingCards = allUpcoming.length ? allUpcoming.map(e => {
    let color, label;
    if(e.type==='assignment'){color='#a78bfa';label='Assignment';}
    else if(e.subtype==='quiz_done'){color='#22c55e';label='Quiz (Done)';}
    else if(e.type==='quiz'){color='#fdd663';label='Quiz';}
    else{color='#f472b6';label='Academic';}
    const mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][month-1];
    return `<div class="lcal-upcoming-card"><div class="lcal-upcoming-type" style="color:${color}">${label}</div><div class="lcal-upcoming-title">${e.title}</div>${e.class_name?`<div class="lcal-upcoming-meta">${e.class_name}</div>`:''}<div class="lcal-upcoming-date" style="color:${color}">${e.day} ${mn}</div></div>`;
  }).join('') : `<div class="lcal-upcoming-empty">Nothing coming up this month</div>`;

  return `<div><div class="lcal-topbar"><div class="lcal-header-left"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;"><button class="lcal-back-btn" onclick="showPage('home')"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><polyline points="15 18 9 12 15 6"/></svg>Back to Home</button><h2 class="lcal-page-title">My Calendar</h2></div>${legend}</div></div><div class="lcal-body"><div class="lcal-main"><div class="lcal-nav-row"><button class="lcal-nav-btn" onclick="fullCalNav(-1)">&#8249;</button><span class="lcal-month-label">${monthNames[month-1]} ${year}</span><button class="lcal-nav-btn" onclick="fullCalNav(1)">&#8250;</button></div><div class="lcal-grid">${dayHeaders}</div><div class="lcal-cells">${cells}</div></div><div class="lcal-upcoming"><div class="lcal-upcoming-label">Upcoming</div>${upcomingCards}</div></div></div>`;
}

function fullCalNav(dir) {
  calState.month += dir;
  if (calState.month < 1) { calState.month = 12; calState.year--; }
  if (calState.month > 12) { calState.month = 1; calState.year++; }
  document.getElementById('content').innerHTML = buildFullCalPage(calState.month, calState.year);
}

function loadDesktopThread(discId) {
  const disc = DISC_DATA.find(d => d.id === discId);

  document.querySelectorAll('.dsk-item').forEach(el => {

        <div class="disc-thread-head-title">${disc.title}</div>

function buildDiscPostHtml(p, isLast) {
  const isOp     = p.is_op;
  const isMe     = p.is_me;
  const isTeacher = p.is_teacher || false;
  const dotClass = isOp ? 'is-op-dot' : (isMe ? '' : 'muted');
  const bodyWrapClass = `disc-body-wrap${isOp ? ' is-op' : ''}${isMe ? ' is-me' : ''}`;

  const opTag      = isOp     ? `<span class="disc-tag op">OP</span>`      : '';
  const meTag      = isMe     ? `<span class="disc-tag me">You</span>`     : '';
  const anonTag    = p.is_anon ? `<span class="disc-tag anon">Anon</span>` : '';
  const teacherTag = isTeacher ? `<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:0.04em;background:rgba(56,178,172,0.12);color:#38b2ac;border:1px solid rgba(56,178,172,0.25);">Teacher</span>` : '';

  const quoteHtml = p.quote ? `<div class="disc-quote"><div class="disc-quote-author">${p.quote.author}</div><div>${p.quote.text}</div></div>` : '';

  const avatarColor = isTeacher ? '#38b2ac' : (isMe || p.is_anon) ? '#555' : '#8b949e';

  return `
    <div class="disc-post-card">
      <div class="disc-spine">
        <div class="disc-spine-dot ${dotClass}"></div>
        ${!isLast ? '<div class="disc-spine-line"></div>' : ''}
      </div>
      <div class="disc-post-content">
        <div class="disc-post-header">
          <div class="disc-avatar" style="background:${isTeacher?'rgba(56,178,172,0.15)':'rgba(255,255,255,0.06)'};color:${avatarColor};border-color:${isTeacher?'rgba(56,178,172,0.3)':'rgba(255,255,255,0.1)'};">${p.initials}</div>
          <span class="disc-author">${p.author}</span>
          ${opTag}${meTag}${anonTag}${teacherTag}
          <span class="disc-time">${p.time}</span>
        </div>
        <div class="${bodyWrapClass}">
          ${quoteHtml}
          <div class="disc-body">${p.msg}</div>
        </div>
        <div class="disc-footer">
          <button class="disc-action-btn reply" onclick="discSetReply('${p.author}','${p.msg.substring(0,60).replace(/'/g,"\\'")}')">
            <i class="fas fa-reply"></i> Reply
          </button>
        </div>
      </div>
    </div>`;
}

function buildDiscCompose() {
  return `
    <div class="disc-compose">
      <div class="disc-reply-preview" id="discReplyPreview">
        <span style="color:#4fd1c5;font-weight:700;flex-shrink:0;">Replying to:</span>
        <span id="discPreviewText" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
        <button onclick="discCancelReply()" style="background:none;border:none;color:#f85149;cursor:pointer;font-size:16px;padding:0 4px;">✕</button>
      </div>
      <div class="disc-compose-box">
        <textarea id="discTextarea" placeholder="Add to the discussion…" rows="1"></textarea>
        <div class="disc-toolbar">
          <label class="disc-anon-label" title="Post anonymously">
            <input type="checkbox" id="discAnon" checked style="display:none;">
            <i class="fas fa-user-secret"></i> Anonymous
          </label>
          <button class="disc-post-btn" onclick="discDemoPost()">
            <i class="fas fa-paper-plane"></i> Post
          </button>
        </div>
      </div>
    </div>`;
}

function wireDiscCompose() {
  const ta = document.getElementById('discTextarea');
  if (ta) {
    ta.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    ta.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); discDemoPost(); }
    });
  }
}

function discDemoPost() {
  const ta = document.getElementById('discTextarea');
  if (!ta || !ta.value.trim()) { showToast('Type a message first'); return; }

  const msg     = ta.value.trim();
  const scroll  = document.getElementById('discPostsScroll');
  if (!scroll) return;

  // Build the new post card and inject
  const isAnon = document.getElementById('discAnon')?.checked ?? true;
  const name   = isAnon ? 'Anonymous' : (LEARNER.name || 'You');
  const initials = isAnon ? '?' : (LEARNER.initials || 'ME');

  const postHtml = buildDiscPostHtml({
    author: name, initials, is_me: true, is_op: false, is_anon: isAnon,
    time: new Date().toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit', hour12: true }),
    msg, quote: null
  }, true);

  // Remove "last" class from the current last spine line
  const existing = scroll.querySelectorAll('.disc-post-card');
  if (existing.length) {
    const lastSpine = existing[existing.length - 1].querySelector('.disc-spine');
    if (lastSpine && !lastSpine.querySelector('.disc-spine-line')) {
      const line = document.createElement('div');
      line.className = 'disc-spine-line';
      lastSpine.appendChild(line);
    }
  }

  const dummy = document.createElement('div');
  dummy.innerHTML = postHtml.trim();
  const bottomEl = scroll.querySelector('div[style="height:8px;"]');
  if (bottomEl) {
    scroll.insertBefore(dummy.firstChild, bottomEl);
  } else {
    scroll.appendChild(dummy.firstChild);
  }

  ta.value = '';
  ta.style.height = 'auto';
  discCancelReply();
  scroll.scrollTop = scroll.scrollHeight;
  showToast('Posted! (Demo — not saved)');
}

function discSetReply(author, preview) {
  window._discReplyTo = { author, preview };
  const p = document.getElementById('discPreviewText');
  if (p) p.textContent = author + ': ' + preview;
  document.getElementById('discReplyPreview')?.classList.add('show');
  document.getElementById('discTextarea')?.focus();
}
function discCancelReply() {
  window._discReplyTo = null;
  document.getElementById('discReplyPreview')?.classList.remove('show');
}

function renderQuizzes() {
  let html = `${demoBanner()}`;
  for (const [subj, quizzes] of Object.entries(D.quizzes)) {
    html += `<div class="subj-head">${subj}</div>`;
    quizzes.forEach(q => {
      let action = '';
      if (q.attempt === 'submitted') action = `<span class="q-action-done">✓ Completed</span>`;
      else if (q.status === 'Closed') action = `<span class="q-action-closed">Closed</span>`;
      else if (q.scheduled) action = `<span style="color:#fdd663;font-weight:700;font-size:13px;">Starts in 14d</span>`;
      else if (q.attempt === 'in_progress') action = `<span class="q-action-progress" onclick="loadInstructions(${q.id})">Continue</span>`;
      else action = `<span class="q-action-start" onclick="loadInstructions(${q.id})">Start</span>`;
      html += `<div class="quiz-card"><div><h4>${q.title}</h4><div class="quiz-info-text"><svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${q.duration} mins &nbsp;|&nbsp;<svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${q.date}</div></div>${action}</div>`;
    });
  }
  document.getElementById('content').innerHTML = html;
}

function loadInstructions(id) {
  const q = Object.values(D.quizzes).flat().find(x => x.id === id);
  if (!q) return;
  const isContinue = q.attempt === 'in_progress';
  document.getElementById('content').innerHTML = `
    <div class="inst-container">
      <h2 style="text-align:center;color:var(--text);margin-bottom:25px;">Quiz Instructions</h2>
      <div class="quiz-info-box"><p><strong>Quiz Title:</strong> ${q.title}</p><p><strong>Duration:</strong> ${q.duration} minutes</p><p><strong>Attempts Allowed:</strong> 1</p></div>
      <h3 style="color:#c9d1d9;margin-bottom:12px;">⚠️ Please read carefully:</h3>
      <ul class="inst-list">${isContinue?`<li style="color:#e67e22"><strong>Note:</strong> You have an unfinished attempt.</li>`:''}<li>You can only attempt this quiz <strong>1</strong> time.</li><li>The timer starts immediately and cannot be paused.</li><li>Tab switching is monitored per question.</li></ul>
      <div class="ai-box"><h4 style="color:var(--accent);margin-top:0;">🤖 AI Invigilator Active</h4><p style="font-size:13px;color:var(--muted);margin:0;">Tab switching and quiz exits are monitored and logged per question.</p></div>
      <button class="start-btn" onclick="showToast('Demo mode: quiz taking not available.')" style="${isContinue?'background:rgba(230,126,34,0.2);border-color:#e67e22;':''}">${isContinue ? 'Continue Quiz' : 'Start Quiz'}</button>
    </div>`;
}

function buildGradesList(quizzes, gi) {
  return quizzes.map((q, qi) => {
    const pub = q.published; const pct = pub ? Math.round((q.score/q.total)*100) : 0;
    const pillCls = !pub ? 'score-pending' : pct>=75 ? 'score-high' : pct>=50 ? 'score-mid' : 'score-low';
    const pillTxt = pub ? `${pct}%` : 'Pending';
    const icon = pub ? `<svg viewBox="0 0 24 24" width="16" height="16" stroke="#4fd1c5" stroke-width="2" fill="none"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>` : `<svg viewBox="0 0 24 24" width="16" height="16" stroke="#f85149" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
    return `<div class="quiz-row"><div class="quiz-row-header" onclick="toggleRow('gdetail-${gi}-${qi}','gexp-${gi}-${qi}')">${icon}<div class="quiz-row-title">${q.title}${q.summative?'<span style="font-size:10px;border:1px solid rgba(79,209,197,0.3);color:#4fd1c5;padding:1px 6px;border-radius:10px;font-weight:700;">Term</span>':''}</div><span class="score-pill ${pillCls}">${pillTxt}</span><button id="gexp-${gi}-${qi}" style="background:none;border:none;color:#4a5568;cursor:pointer;padding:4px;display:flex;align-items:center;" onclick="event.stopPropagation();toggleRow('gdetail-${gi}-${qi}','gexp-${gi}-${qi}')"><svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"/></svg></button></div><div class="quiz-row-details" id="gdetail-${gi}-${qi}">${pub?`<p><strong>Score:</strong> ${q.score}/${q.total} · <strong>${pct}%</strong></p><button class="view-details-btn" onclick="showToast('Class avg: 67% | Highest: 85%')">Class Performance</button>`:`<p style="color:#4a5568;font-style:italic;">Marks not published yet.</p>`}<p style="margin-top:8px"><strong>Duration:</strong> ${q.duration} min</p><p><strong>Taken:</strong> ${q.taken}</p></div></div>`;
  }).join('');
}

function buildTermTable(quizzes) {
  const summative = quizzes.filter(q => q.summative && q.published);
  if (!summative.length) return `<p style="text-align:center;color:#4a5568;font-style:italic;padding:20px;">No summative assessments yet.</p>`;
  let rows='', earnedTotal=0, weightTotal=0;
  summative.forEach(q => { const earned=(q.score/q.total)*q.weight; earnedTotal+=earned; weightTotal+=q.weight; rows+=`<tr><td>${q.title}</td><td>${q.weight}%</td><td>${q.score}/${q.total}</td><td style="color:#4fd1c5;font-weight:800">${earned.toFixed(1)}/${q.weight}%</td></tr>`; });
  const finalPct = Math.round((earnedTotal/weightTotal)*100);
  return `<div class="term-table-wrap"><table class="term-table"><thead><tr><th>Quiz</th><th>Weight</th><th>Score</th><th>Earned</th></tr></thead><tbody>${rows}<tr class="term-total"><td>TOTAL</td><td>${weightTotal}%</td><td>—</td><td style="color:#22c55e">${earnedTotal.toFixed(1)}/${weightTotal}% → ${finalPct}%</td></tr></tbody></table></div>`;
}

function toggleCard(i) { const body=document.getElementById('gcard-'+i); const chev=document.getElementById('gchev-'+i); const isOpen=chev.classList.contains('open'); body.style.display=isOpen?'none':'block'; chev.classList.toggle('open',!isOpen); }
function toggleRow(detailId,btnId) { const d=document.getElementById(detailId); if(!d)return; const open=d.style.display==='block'; d.style.display=open?'none':'block'; const btn=document.getElementById(btnId); if(btn)btn.querySelector('svg').style.transform=open?'':'rotate(180deg)'; }
function switchView(gi,view) { const listEl=document.getElementById('glist-'+gi); const termEl=document.getElementById('gterm-'+gi); const btnL=document.getElementById('vt-list-'+gi); const btnT=document.getElementById('vt-term-'+gi); if(view==='list'){listEl.style.display='block';termEl.style.display='none';btnL.classList.add('active-view');btnT.classList.remove('active-view');}else{listEl.style.display='none';termEl.style.display='block';btnL.classList.remove('active-view');btnT.classList.add('active-view');} }
