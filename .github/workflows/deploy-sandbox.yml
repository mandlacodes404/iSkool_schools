name: 🚀 Deploy to Sandbox

on:
  push:
    branches:
      - dev

jobs:
  web-deploy:
    name: 🎉 Sync to Sandbox
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /home/iskowdbw/sandbox.iskool.online/   # looks correct for add-on domain
          exclude: |
            **/.git*
            **/.git*/**
            **/.github
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/storage/logs/**
            **/.env*
            composer.lock
          log-level: verbose
          # dry-run: true   # ← COMMENT OUT or DELETE this line (or set to false)
          # dangerous-clean-slate: true   # keep commented for now