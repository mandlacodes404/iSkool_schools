name: 🚀 Deploy to Sandbox

on:
  push:
    branches:
      - dev  # This only runs when you push to your 'dev' branch

jobs:
  web-deploy:
    name: 🎉 Sync to Sandbox
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 📂 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: sandbox.iskool.online/   # trailing / is recommended for consistency
          exclude: |
            **/.git*
            **/.git*/**
            **/.github
            **/.github/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/storage/logs/**
            **/.env*
            composer.lock
            # Add more if needed, e.g.:
            # **/.DS_Store
            # **/*.log
          log-level: verbose               # Shows detailed skip/upload info – keep for now
          dry-run: true                    # Set to false (or remove) after testing
          # Optional: If you ever want aggressive cleanup (careful!):
          # dangerous-clean-slate: false   # default is false