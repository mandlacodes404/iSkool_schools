name: 🚀 Deploy to Production

on:
  push:
    branches:
      - main  # This ONLY runs when you push to the main branch

env:
  APP_VERSION: "1.1.2"   # ← ONLY change this when you release a new version

jobs:
  web-deploy:
    name: 🎉 Sync to Live Site
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v3

      - name: 🏷️ Generate version.php
        run: |
          cat > version.php << PHP
          <?php
          if (!defined('APP_VERSION')) define('APP_VERSION', '${{ env.APP_VERSION }}');
          PHP

      - name: 📂 Sync Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Destination for your main site
          server-dir: public_html/ 
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            **/vendor/**
            **/node_modules/**
            **/sandbox.iskool.online/**
            **/cgi-bin/**
            **/.env*
            composer.lock
            .gitignore
          log-level: verbose